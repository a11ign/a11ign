# GENERATED by `node scripts/outsider/generate.mjs` from README.md's own Quickstart fence. Do not edit by hand:
# packages/lab/src/packaging/outsider-job.test.ts checks this file against the document it was generated from.
#
# #3181: the workflow that runs in a repository OUTSIDE the a11ign organisation, from an EMPTY workspace, once per
# release. It holds no stored credential: it pulls the registry and starts its own runs with its own `github.token`.
# See scripts/outsider/generate.mjs for why, for the two measurements, and for the one thing it cannot do alone.
name: outsider
run-name: ${{ github.event_name == 'workflow_dispatch' && format('outsider v{0} {1}', inputs.version, inputs.sha) || 'outsider poll' }}

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: The a11ign version to rehearse, as npm serves it (no leading v)
        required: true
      sha:
        description: That version's release tag, as a full commit sha
        required: true

jobs:
  poll:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start a run for a release this repository has no completed run for
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(npm view a11ign dist-tags.latest)
          tag_sha=$(git ls-remote https://github.com/a11ign/a11ign "refs/tags/v${version}^{}" | cut -f1)
          [ -n "$tag_sha" ] || tag_sha=$(git ls-remote https://github.com/a11ign/a11ign "refs/tags/v${version}" | cut -f1)
          [ -n "$tag_sha" ] || { echo "::error::no release tag v${version} on https://github.com/a11ign/a11ign"; exit 1; }
          title="outsider v${version} ${tag_sha}"
          # A run counts as answered once it is unfinished or ended success/failure: a cancelled one never answered,
          # and a version already red must not be re-run every hour on a windows runner.
          answered=$(gh run list --workflow "$GITHUB_WORKFLOW" --limit 200 --json displayTitle,status,conclusion \
            | jq --arg t "$title" '[.[] | select(.displayTitle == $t)
                | select(.status != "completed" or (.conclusion | IN("success", "failure", "timed_out", "startup_failure", "action_required")))] | length')
          if [ "$answered" != "0" ]; then echo "${title}: already has a run"; exit 0; fi
          gh workflow run "$GITHUB_WORKFLOW" -f version="$version" -f sha="$tag_sha"
          echo "started: ${title}"

  pin:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # this repository's own workflow file, which holds the one copy of the pin
        with:
          persist-credentials: false
      - name: Refuse a run whose pin is not the release it is named for
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          version="$VERSION"
          tag_sha=$(git ls-remote https://github.com/a11ign/a11ign "refs/tags/v${version}^{}" | cut -f1)
          [ -n "$tag_sha" ] || tag_sha=$(git ls-remote https://github.com/a11ign/a11ign "refs/tags/v${version}" | cut -f1)
          [ -n "$tag_sha" ] || { echo "::error::no release tag v${version} on https://github.com/a11ign/a11ign"; exit 1; }
          workflow_file="${GITHUB_WORKFLOW_REF#"${GITHUB_REPOSITORY}/"}"
          workflow_file="${workflow_file%%@*}"
          pinned=$(sed -nE 's#^[[:space:]]*(- )?uses:[[:space:]]*a11ign/a11ign@([0-9a-f]{40})([[:space:]].*)?$#\2#p' "$workflow_file")
          case "$pinned" in
            "" | *$'\n'*)
              echo "::error::${workflow_file} has no single line pinning the Action to a full commit sha, so there is no pin to read"
              exit 1 ;;
          esac
          if [ "$SHA" != "$tag_sha" ]; then
            echo "::error::this run is named for ${SHA}, but v${version} is ${tag_sha}"
            exit 1
          fi
          if [ "$pinned" != "$tag_sha" ]; then
            echo "::error::this file pins ${pinned}, which is not v${version} (${tag_sha}): regenerate it with"
            echo "::error::node scripts/outsider/generate.mjs --sha=${tag_sha} --version=${version} and commit it here. The run is red"
            echo "::error::rather than green because it would otherwise test a release it is not named for"
            exit 1
          fi

  # >>> README's job from here: its lines, but for the ref, the url and the task, and one `needs:`
  a11y:
    needs: [pin]
    runs-on: windows-2022          # NVDA needs Windows; GitHub hosts these
    timeout-minutes: 20           # a run that will not finish says so here, not after GitHub's own default
    permissions:
      contents: read
      pull-requests: write         # for the PR comment below; omit it and the report still runs, only quieter
    steps:
      - uses: actions/checkout@v4
      - uses: a11ign/a11ign@021d6f6fd3123f6a63cfbc46d39f492fe595cfd5
        # Pinned to v0.1.0, the first tagged release. Use the full commit SHA instead if your CI must
        # not move even across a release.
        id: a11ign
        with:
          url: https://www.w3.org/WAI/demos/bad/before/home.html
          task: Find the main navigation and reach the survey.
      # Keep the evidence: the full result, including the transcript behind every finding. Guarded on the
      # output existing, so a run that failed does not also fail the upload.
      - uses: actions/upload-artifact@v4
        if: always() && steps.a11ign.outputs.result-json != ''
        with:
          name: a11ign-result
          path: ${{ steps.a11ign.outputs.result-json }}
          if-no-files-found: warn
  # <<< README's job ends

  summary:
    needs: [pin, a11y]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        if: needs.a11y.result == 'success'
        with:
          name: a11ign-result
          path: result
      - name: Judge the documented path, and say what it did not cover
        env:
          PIN: ${{ needs.pin.result }}
          JOB: ${{ needs.a11y.result }}
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## outsider: the documented path, run from an empty workspace

          Ran README.md's Quickstart job as written. Judged: it completed, and `a11ign-result.json` has the documented shape.

          ### Not covered by this run
          - README.md: "Locally instead": a capture worker you control, `pnpm run doctor`
          - docs/getting-started.md: routes A, B and C: a worker on a Mac, on your own Windows machine, or none
          - docs/try-it.md: "The other route: run it from the repository", and the authenticated run behind a login

          ### Substitutions: every line that differs from README.md's fence
          - README.md line 178: `- uses: a11ign/a11ign@v0.1.0` became `- uses: a11ign/a11ign@<the release's full commit sha, as pinned on that line of this file>`
          - README.md line 183: `url: https://example.com/contact` became `url: https://www.w3.org/WAI/demos/bad/before/home.html`
          - README.md line 184: `task: Send an enquiry` became `task: Find the main navigation and reach the survey.`
          - added: `needs: [pin]` under the job's key, so it waits for the pin check
          SUMMARY
          if [ "$PIN" != "success" ]; then echo "::error::the pin check did not succeed ($PIN)"; exit 1; fi
          if [ "$JOB" != "success" ]; then
            echo "::error::the documented job did not succeed ($JOB): a reader following only README.md hit exactly this"
            exit 1
          fi
          jq -e '(.verdict.findings | type == "array") and (.verdict | has("taskCompletable")) and has("captureVerified")' result/a11ign-result.json > /dev/null \
            || { echo "::error::a11ign-result.json is missing or lacks the documented shape"; exit 1; }
