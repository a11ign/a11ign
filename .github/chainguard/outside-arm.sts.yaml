# Trust policy for agent-org's scheduled `outside-sweep` job, which arms a11ign's approved pull requests from OUTSIDE this repository
# (agent-org#1573, epic "agent-org stands alone"; row a11ign#5619). Octo STS v0.11.2 reads the policy from the TARGET repository's default
# branch, so the identity `outside-arm` minted with `scope: a11ign/a11ign` needs this file HERE. Nothing mints from it while agent-org's
# `outside.arm` flag is off: the workflow reads the flag first.
#
# `sub` carries IMMUTABLE ids (`repo:<owner>@<id>/<repo>@<id>`), read 2026-10-16: owner 320310787, agent-org 1388747923 (#4191).
#
# WHAT BINDS IT TO `main`: `job_workflow_ref` pinned to `@refs/heads/main`, so a branch that edits the workflow cannot mint.
# `event_name: schedule` admits only the scheduled sweep; the pull-request event and the approval are the host gate's, which holds its
# own identity. Same permissions as `auto-arm.sts.yaml` (enable auto-merge, the merge itself and `workflows` write), on this repository
# only.
#
# WHY `workflows`: GitHub refuses `enablePullRequestAutoMerge` to an app without `workflows` on a pull request that changes a file under
# `.github/workflows/` (a11ign/lab#150, and lab#148 in lab's auto-arm run 40092564867). Approved workflow changes merge like any other,
# with no person, by the chairman's decision on 2026-10-24 (A11-203). The `main` binding above is what limits this write to the scheduled
# sweep of agent-org's `auto-arm.yml` as it is on `main`.
issuer: https://token.actions.githubusercontent.com
subject_pattern: repo:a11ign@320310787/agent-org@1388747923:ref:refs/heads/main
claim_pattern:
  job_workflow_ref: a11ign/agent-org/\.github/workflows/auto-arm\.yml@refs/heads/main
  event_name: schedule
permissions:
  pull_requests: write
  contents: write
  workflows: write
