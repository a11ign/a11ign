# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json
#
# THE TOKEN `docs-pin-write.yml` PUSHES THE RE-PIN BRANCH AND OPENS ITS PULL REQUEST WITH (#5224, #5121 option A, `ceo` 2026-10-11). Octo STS
# v0.11.2 syntax; a repository policy reaches only the repository it sits in. Every pattern is matched against the WHOLE claim, so none is anchored.
#
# WHY AN INSTALLATION TOKEN AT ALL: `GITHUB_TOKEN` writes fire no workflow, so the re-pin pull request would have no `ci.yml` run and never
# become mergeable (#416).
#
# WHAT BINDS IT TO `main`: `subject` is the EXACT `sub` of a run on the `main` ref, which both triggers present (`workflow_run` runs the
# workflow file as it is on the default branch, and `workflow_dispatch` on `main`); a dispatch on another branch presents that branch's ref and
# is refused. `job_workflow_ref` pinned to `@refs/heads/main` closes the other door: a branch that edits `docs-pin-write.yml` cannot mint.
# No `pull_request*` event is named. `sub` carries IMMUTABLE ids, never names (#4191).
#
# UNMEASURED WHEN WRITTEN, STATED RATHER THAN ASSUMED: the `sub` of a `workflow_run` run. The `workflow_dispatch` half is the same shape the
# sibling policies measured. If a `workflow_run` run presents anything but `ref:refs/heads/main`, the mint is refused and the job is red
# naming the step, which is the safe direction; the first `release` success after this lands is the reading.
#
# WHAT IT HOLDS: `contents: write` (push the one `automation/docs-pin-write` branch), `pull_requests: write` (open and update the pull request)
# and, since #5291, `workflows: write`, on THIS repository only. `workflows` is there for ONE file: the re-pin regenerates
# `.github/workflows/consumer-gate.yml`, which copies README's Quickstart fence and so goes stale with every re-pin (`ceo`, #5283), and GitHub
# refuses a write under `.github/workflows/` for a token without it. The job that holds the token has NO checkout, install or node, and its
# shape check writes only an exact allowlist of paths (`README.md`, `docs/*.md`, `docs/adr/*.md`, `scripts/outsider/outsider-job.yml` and that
# one workflow file), each refused unless it differs from its base by shas and versions alone. The same grant, on the same terms, is
# `consumer-gate-pin-write.sts.yaml`'s, and the installation already holds it (#5210 was written by `octo-sts[bot]` under it). It is not a merge
# identity: the pull request needs the approving review `main` requires (#2022).
issuer: https://token.actions.githubusercontent.com
subject: repo:a11ign@320310787/a11ign@1280353940:ref:refs/heads/main
claim_pattern:
  job_workflow_ref: a11ign/a11ign/\.github/workflows/docs-pin-write\.yml@refs/heads/main
  event_name: workflow_run|workflow_dispatch
permissions:
  contents: write
  pull_requests: write
  workflows: write
