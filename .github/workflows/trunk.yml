name: trunk
# UNTIL 2026-09-12 THIS FILE WAS `trunk.yml`, AND `trunk-sweep.yml` AND `close-rows.yml` STOOD BESIDE IT (#909,
# The CI Reset step 4). Closing a merged PR's rows now rides THIS workflow's push (the `closeRows` job below),
# because since #416 every merge is completed with the A11IGN_BOT_TOKEN PAT and DOES fire push -- the 2026-09-08
# measurement that killed the first such job was made under GITHUB_TOKEN merges, which fire nothing. #417's
# scheduled backstop (the gate sweep and the close-rows sweep) moved to `nightly.yml`'s hourly `:37` cron, NOT
# here: a schedule on this file would expose the watchdogs and the recheck to GitHub's 60-day schedule-disable,
# which the header below explains is the one thing they must never be exposed to. `auto-arm.yml` was NOT
# collapsed: drafts cannot be armed, so arming on ready_for_review stays an event this push cannot see, and it
# hosts the update-branch train's three non-push triggers (#1094, #1100, #1103).

# THE MERGE COMMIT THAT LANDS ON `main` HAS NEVER ITSELF BEEN TESTED -- pipeline unit 3, #316. Unit 1
# (#298) made this real by turning branch protection's `strict` off: `ci.yml`'s `pull_request` trigger
# tests a PR's own HEAD, never the merge commit GitHub actually produces when it lands, and with
# `strict=false` nothing requires that merge commit to match a tree anyone tested before the merge
# completes. This workflow is the one place that gap is closed -- it runs the full suite against `main`'s
# real, new tip on every push. WHEN IT FAILS NOTHING IS REVERTED (#2356, the chairman's ruling of 2026-09-24:
# THE ORG ALWAYS FIXES FORWARD): the `trunkRecheck` job records whether the red is this merge's own, and
# `work-gate.mjs`'s `trunk-red` cause wakes a fixer with that answer in its prompt. Until #2356 this file
# opened an automatic revert; see `packages/agent-org/src/trunk-red.mjs`'s header for why that went.
#
# THIS IS DELIBERATELY NOT `ci.yml`'s `gate`, and not merely a copy of it moved to `push`. `ci.yml`'s own
# header rules a push trigger out THERE for a real reason -- "a check that runs after the merge cannot
# stop it, which is exactly what a push trigger was" -- and that reasoning is still correct for PRE-merge
# gating. This workflow is not pre-merge gating; it cannot stop a merge that already landed, and does not
# try to. It is the reactive half: verify, and where it is safe to, fix forward. See
# `push-trigger-allowlist.test.ts`'s `TRUNK_GATE_ALLOWLIST` for why this is its own closed category,
# structurally distinct from the lightweight, continue-on-error watchdogs that were the only push-to-main
# precedent before this row -- the `trunkGate`/`trunkBuildTest`/`trunkRecheck` chain DOES build, DOES run
# the full suite, and is NOT continue-on-error, because a red run there is exactly the signal that wakes
# the fixer, not something to observe and move past.
#
# THE WATCHDOGS LIVE HERE TOO, SINCE #901 (The CI Reset, step 1), AS THE SEPARATE `watchdogs` JOB BELOW.
# Until 2026-09-10 they were three workflows of their own, each firing on every push to main -- 777 runs
# on the day measured, for three scripts that each take seconds. They ask whether the board editions are
# still arriving (`board-report.yml` and `board-summary-check.yml`, watched by
# `packages/agent-org/src/board-schedule-liveness.mjs`), whether the first-publish NPM_TOKEN is still present (#73), and
# whether the pull request that produced this commit was actually tested (#118). Each is a property of
# TIME, and each MUST still run on push and never on a cron: GitHub disables scheduled workflows
# repository-wide after 60 days of inactivity, so a scheduled watchdog dies in the same breath as the jobs
# it guards, while a push cannot be disabled by inactivity because a push IS the activity. This workflow
# already runs on every push, so the three steps here cost no workflow runs of their own. They are
# `continue-on-error`, deliberately: each finding is about the pipeline or a secret, never about the commit
# that happened to trigger it, and failing the push would blame an unrelated author. `trunkRecheck` does
# not depend on this job, so a red watchdog can never be read as a red `main`. `board-liveness.test.ts`,
# `npm-token-liveness.test.ts` and `workflow-run-liveness.test.ts` pin all of that against this file.
#
# UNSCOPED, DELIBERATELY, unlike `ci.yml`'s per-package `ts` job. A push to `main` is a merge, which by
# definition can touch anything, and pushes to `main` are far less frequent than PR commits -- there is no
# throughput pressure here that would justify the same path-scoping.
#
# KNOWN GAP, STATED RATHER THAN HIDDEN: this does not (yet) run `ci.yml`'s `ansible` syntax-check or
# `rulesFitness` (`npm run rules-check`) jobs. Both are cheap to add later; left out of the first version
# to keep this row's scope to the red-trunk MECHANISM, which is what #316's acceptance actually exercises.
on:
  push:
    branches: [main]
  # #417: `workflow_dispatch`, so nightly.yml's `gateSweep` job can trigger a real gate RUN against `main`'s current
  # tip when a bot merge (GITHUB_TOKEN-authored, so `push` never fires -- #394's overnight measurement)
  # left it with zero check runs. No `ref` input needed: `workflow_dispatch` with none given runs against
  # the repository's DEFAULT branch, which is `main`, so `github.sha` inside the run correctly resolves
  # to main's tip either way.
  workflow_dispatch:
    inputs:
      pr:
        description: "#909: a merged PR number whose declared rows should be closed now (optional; a bare dispatch runs the gate)"
        required: false

jobs:
  # #909: CLOSE THE ROWS THE MERGED PR DECLARED, riding this push. `close-rows-sweep.mjs` finds every PR merged
  # into main inside the window and closes what each declared, idempotently (a row already closed is reported
  # as `already`, never re-closed), so this needs no PR number from the push event and also covers a merge
  # whose own push run was missed. A dispatch with `pr` closes that one PR's rows directly. Permissions are the
  # ones `close-rows.yml` carried and no more: a job triggered by a merge must never be able to push, and
  # `close-rows-on-merge.test.ts` goes red if `contents` is raised HERE, whatever `trunkRecheck` below holds.
  closeRows:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Close the rows the merged PR declared, naming the merge sha on each
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISPATCH_PR: ${{ github.event.inputs.pr }}
        run: |
          if [ -n "$DISPATCH_PR" ]; then
            node packages/agent-org/src/close-rows-for-merged-pr.mjs "$DISPATCH_PR"
          else
            node packages/agent-org/src/close-rows-sweep.mjs --window=60
          fi
  # #394 UPDATE, 2026-09-08: A `closeRowsSweep` JOB USED TO STAND HERE, RIDING THIS WORKFLOW'S OWN
  # `push: branches: [main]` TRIGGER. IT WAS DEAD ON ARRIVAL AND HAS BEEN REMOVED.
  #
  # Measured: GitHub does not trigger workflows from events created with `GITHUB_TOKEN` -- a merge
  # completed by `github-actions[bot]` (every merge `auto-arm.yml` completes) produces a `pull_request:
  # closed` event AND a push to `main` that start NOTHING. 19 of 19 bot-merged PRs never ran `close-
  # rows.yml`; 5 of 5 sampled bot-merge SHAs never ran `trunk.yml` at all -- not "ran and passed",
  # never ran. So a job riding THIS workflow's push trigger, built specifically to backstop bot merges,
  # could never fire for the one case it existed to catch: a guard that structurally cannot run for its
  # own target is worse than no guard, because it reads as coverage that was never real.
  #
  # (#909, 2026-09-12: with PAT merges the push DOES fire, and the `closeRows` job above rides it.)
  # `close-rows.yml`'s own `workflow_dispatch` (added in the same PR as the now-removed sweep) became the
  # optional `pr` input above --
  # it is how the workflow can be exercised deliberately regardless of which identity merged. The
  # backstop this row needed is #417 (an interim scheduled sweep, gated on `main`'s tip carrying zero
  # check runs) and #416 (the permanent fix: arm with a real PAT so bot merges stop being invisible to
  # every `pull_request`/`push` trigger in this repository, not just this one).

  # THE WATCHDOGS (#901): three continue-on-error steps, one per liveness script. See the header for why
  # they are here rather than in `nightly.yml`, and why `trunkRecheck` must never depend on this job.
  watchdogs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write          # one comment per stale spell, on the report issue (#20) or on #73
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Was the pull request that produced this commit actually tested? (#118)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packages/agent-org/src/workflow-run-liveness.mjs --sha=${{ github.sha }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Are the board editions still arriving? (#272, #590)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packages/agent-org/src/board-schedule-liveness.mjs --post --issue=20
      - name: Is NPM_TOKEN still there? (#73)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ORG_SECRETS_READ_TOKEN || github.token }}
        run: node scripts/npm-token-liveness.mjs --post --issue=73

  # THE ONLY QUESTION THIS JOB ANSWERS: did this push silently revert work already on main. `trunkBuildTest`
  # below answers the OTHER half (is main's new tip actually green); `trunkRecheck` records whether either
  # failure is this push's own, or something else.
  trunkGate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # #411: A MERGE CAN DELETE WORK ALREADY ON `main` WHILE EVERY OTHER CHECK STAYS GREEN -- see
      # trunk-revert-guard.mjs's own header for the incident and why the obvious instruments (git
      # merge-tree on the merge's two parents, GitHub's own PR file list) both fail to catch it. Pure git,
      # no build or install needed, so it runs FIRST -- a revert-worthy push fails fast rather than
      # waiting on a full suite that cannot see this class of defect at all. `fetch-depth: 0` above
      # already gives it everything it needs: the merge's own parents are both within `main`'s full
      # history, unlike a case needing another PR's unrelated branch tip.
      - name: This push did not silently revert work already on main (#411)
        run: node packages/agent-org/src/trunk-revert-guard.mjs --merge=${{ github.sha }}

  # A1 (#452): CALLS `reusable-build-test.yml` -- see that file's own header for why (it used to duplicate
  # `ci.yml`'s `ts`+`python` jobs independently; chairman's own comment on `ci.yml` had measured the two
  # running "the SAME suite, on every merge"). `needs: trunkGate` preserves the original fail-fast order:
  # this only runs once the revert-guard check (pure git, no build) has passed, exactly as it did when both
  # were sequential steps in one job -- a revert-worthy push still fails fast rather than paying for a full
  # suite that cannot see that class of defect at all.
  #
  # UNSCOPED + PYTHON, DELIBERATELY, unlike `ci.yml`'s per-package `ts`/`python` jobs -- a push to `main` is
  # a merge, which by definition can touch anything, and pushes to `main` are far less frequent than PR
  # commits, so there is no throughput pressure here that would justify the same path-scoping.
  trunkBuildTest:
    needs: trunkGate
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      run-lint-typecheck: true
      run-ts-tests: true
      ts-test-scope: unscoped
      run-python-tests: true

  # #2356, THE CHAIRMAN'S RULING OF 2026-09-24: THE ORG ALWAYS FIXES FORWARD, and this job used to be
  # its predecessor. It opened a `revert/` branch and a pull request when `main` went red on a merge's own
  # failure; that is DELETED, and nothing in this file, and no session, opens one. What replaced it is not
  # a smaller revert but a record: the parent re-check below is KEPT, because it is what says whether a red
  # is THIS merge's own or inherited, and its answer is now written where `work-gate.mjs`'s `trunk-red`
  # cause can read it (an annotation on this job's check-run) instead of being fed to a revert. The gate
  # wakes a fixer with that answer in its prompt; `packages/agent-org/src/trunk-red.mjs` has the rest.
  #
  # RUNS WHEN EITHER `trunkGate` OR `trunkBuildTest` ACTUALLY FAILED -- and `always() &&` IS REQUIRED, not
  # decorative. An `if:` with no status-check function carries an IMPLICIT `success()` (per GitHub's own
  # expression documentation), so the effective condition would be `success() && needs.trunkGate.result ==
  # 'failure'`, and `success()` is false exactly when a needed job failed: self-contradictory, and it meant
  # this job's predecessor never fired once until `always()` lifted it (5 of the newest 40 trunk-guard runs
  # had `trunkGate=failure` and the job read `skipped` in all five). `always()` does not make the job
  # unconditional, because the explicit `result == 'failure'` checks still do the discriminating.
  # `cancelled` stays excluded: a cancellation is not a failure. `trunkBuildTest` reads `skipped` (not
  # `failure`) when `trunkGate` itself failed, so the two results are never double-counted.
  #
  # NO `contents: write`, NO `pull-requests: write`, AND NO PAT: this job READS. It pushes nothing and opens
  # nothing, and `trunk-fix-forward.test.ts` pins that it holds neither grant.
  trunkRecheck:
    needs: [trunkGate, trunkBuildTest]
    if: always() && (needs.trunkGate.result == 'failure' || needs.trunkBuildTest.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm run build
      # The re-check runs the red job's own battery, which includes pytest (#2389 review).
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-ci.txt
      # #616: WAS THE PARENT GREEN BECAUSE IT WAS CORRECT, OR BECAUSE IT WAS MEASURED EARLIER?
      #
      # Every other input to "is this red this merge's own" is a RECORDED conclusion, true as of the moment it
      # was taken. On 2026-09-09 `main` went red on a wall-clock assertion; the parent was green, verifiably,
      # in its own run sixty-one minutes earlier -- and the answer silently encoded the time it was read.
      #
      # NO THRESHOLD FIXES THIS. "Only trust a parent measured in the last N minutes" needs N to exceed the
      # slowest honest gap between two trunk runs, and the case that matters fits inside it. The only way to
      # turn a stale boolean into a current one is to ask again, now.
      #
      # WHY THE WHOLE SUITE RATHER THAN THE FAILING FILE. `node:test`'s TAP output names the failing test
      # (`not ok 1413 - the summary states WHEN ...`) and not the file it came from, so narrowing on a parse
      # of that would be a guess. One extra run on a path that fires rarely is the right trade.
      #
      # ONLY WHEN `trunkBuildTest` FAILED. `trunkGate` asks whether THIS PUSH silently reverted work already
      # on main -- a question about this merge's own two parents, which has no meaning evaluated at the
      # parent. So a trunkGate-only failure records `pass` with that reason stated here rather than inferred.
      - name: Does the parent fail the same check NOW? (#616)
        id: recheck
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ]; then BEFORE="$(git rev-parse HEAD^1)"; fi
          if [ "${{ needs.trunkBuildTest.result }}" != "failure" ]; then
            echo "trunkBuildTest did not fail, so the failure is trunkGate's -- a question about THIS"
            echo "merge's own parents, which cannot be inherited or caused by the world. Recording pass."
            echo "result=pass" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # #775: A CLONE, NEVER A LINKED WORKTREE. `git worktree add` pins the WORKING TREE at `$BEFORE`
          # but shares the underlying repository -- objects AND refs -- with this checkout, so
          # `refs/remotes/origin/main` inside the pinned worktree was never `$BEFORE`'s own `origin/main`,
          # it was whatever `origin/main` is in the SHARED repository right now. A fresh clone has its own
          # independent `.git`, so its `refs/remotes/origin/main` can be set to `$BEFORE` without touching
          # this checkout's real one.
          git clone --quiet . /tmp/parent
          git -C /tmp/parent update-ref refs/remotes/origin/main "$BEFORE"
          git -C /tmp/parent checkout --quiet --detach "$BEFORE"
          cd /tmp/parent
          # A re-check that CANNOT RUN reports unknown, never pass: `pass` is the only answer that blames the
          # merge. A non-zero from the install or the build is not the same answer as a non-zero from the suite.
          if ! pnpm install --frozen-lockfile --ignore-scripts > /tmp/parent-install.log 2>&1; then
            echo "::warning::could not install at the parent; the re-check is UNKNOWN, not a pass."
            echo "result=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # #2389 review: `|| true` HERE WAS A FALSE PASS. A parent whose build broke has no `dist`, its suite
          # then fails for that reason or (worse) skips what needs it, and the answer read as the parent's own.
          if ! npm run build > /tmp/parent-build.log 2>&1; then
            echo "::warning::the parent does not build; the re-check is UNKNOWN, not a pass."
            echo "result=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # #2389 review: THE SAME BATTERY AS `trunkBuildTest`, in the same order (reusable-build-test.yml with
          # `run-lint-typecheck`, `ts-test-scope: unscoped`, `run-python-tests`). This step ran `npm test`,
          # whose `test:ts` glob EXCLUDES packages/agent-org and packages/lab, so a red there re-checked
          # green at the parent and an inherited failure was recorded as this merge's own. `trunk-revert.test.ts`
          # pins that each command below is one the red job runs. A failure that is not a `not ok` line (lint,
          # typecheck, pytest) summarises as `unknown`, which is honest: nobody can name a test.
          if npm run lint > /tmp/parent-test.log 2>&1 \
            && npm run typecheck >> /tmp/parent-test.log 2>&1 \
            && npm run test:all >> /tmp/parent-test.log 2>&1 \
            && PYTHONDONTWRITEBYTECODE=1 pytest -p no:cacheprovider packages/*/tests -q >> /tmp/parent-test.log 2>&1; then
            echo "the parent PASSES the suite now -- its recorded green is still the answer."
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "the parent FAILS the suite now, on a tree this push did not touch."
            # #744: NEVER `tail -40` -- the last forty lines of a node:test run are the trailing PASSING
            # subtests, not the failure. `parent-recheck-summary.mjs` prints the actual `not ok` lines and
            # the `# fail N` summary, wherever they sit in the log, and reports `unknown` rather than `fail`
            # when it cannot name a real failing subtest.
            cd - >/dev/null
            node packages/agent-org/src/parent-recheck-summary.mjs /tmp/parent-test.log | tee /tmp/parent-summary.log
            RECHECK_RESULT="$(grep -oE 'RECHECK_RESULT=(fail|unknown)' /tmp/parent-summary.log | tail -1 | cut -d= -f2)"
            echo "result=${RECHECK_RESULT:-unknown}" >> "$GITHUB_OUTPUT"
          fi

      # THE HAND-OFF TO THE GATE (#2356). `work-gate.mjs` cannot read a step output -- the API does not expose
      # them -- and a job's own conclusion is `success` whichever way the re-check went, so the answer is
      # written as an ANNOTATION on this job's check-run, which the gate reads by the title below
      # (`RECHECK_ANNOTATION_TITLE` in `trunk-red.mjs`; `trunk-fix-forward.test.ts` pins that the two agree).
      # `if: always()` so an earlier step failing still leaves an answer, and it is `unknown` then, never a pass:
      # `pass` is the only answer that blames the merge. The failing parent tests ride in the message so the
      # gate can tell a SHARED failure (inherited) from a DISJOINT one (#1359) without re-running anything.
      - name: Record the answer where the gate can read it (#2356)
        if: always()
        env:
          RECHECK_RESULT: ${{ steps.recheck.outputs.result }}
        run: |
          case "$RECHECK_RESULT" in pass|fail|unknown) ;; *) RECHECK_RESULT=unknown ;; esac
          {
            echo "RECHECK_RESULT=$RECHECK_RESULT"
            if [ -f /tmp/parent-summary.log ]; then grep -E '^not ok [0-9]+' /tmp/parent-summary.log | head -30 || true; fi
          } > /tmp/recheck-annotation.txt
          # A workflow command is one line: `%`, CR and LF are escaped the way GitHub documents.
          MESSAGE="$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' /tmp/recheck-annotation.txt | awk 'NR>1{printf "%%0A"} {printf "%s",$0}')"
          echo "::notice title=trunk-recheck::$MESSAGE"
