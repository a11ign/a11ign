# WHAT OIDC CLAIMS DOES EACH TRIGGER PRESENT? -- #4191, a MEASUREMENT workflow that is deleted by its closing change.
#
# A trust policy (Octo STS: `.github/chainguard/<identity>.sts.yaml`) is bound to the claims a run presents, and a policy bound to a
# GUESSED subject either mints for the wrong run or for none. `auto-arm.yml` reads its token on `pull_request` and `push`, and
# `dependency-pr-body.yml` on `pull_request_target`, so the policy rows for them cannot be written until the real `sub` and
# `job_workflow_ref` of each trigger are read. This prints them, once per trigger, so the row can carry a table of run links.
#
# WHAT IT PRINTS: an ALLOWLIST of decoded claims and NEVER the token. The token is masked (`::add-mask::`) before it is held in a
# variable, it never reaches `echo`, and a claim outside the list is not printed, so a claim added to the token tomorrow is not
# published by this file.
#
# WHAT IT DOES NOT DO: it checks out NOTHING and runs NO pull-request code. A `pull_request_target` job holding the id-token write permission
# that built the branch would be the hole this work exists to close, so the job has no checkout step and its only `run:`
# reads the environment the runner supplies. `permissions` is the id-token write permission and contents read and nothing else; the
# `pull_request_target` run's workflow comes from `main`, so it cannot run before this file is merged.
#
# AUDIENCE: `octo-sts.dev`, a name the claimant chose. The Octo STS documentation read for this row (octo-sts/action README, v1.1.1) names no
# audience input and no default, so `aud` here is NOT a reading of what Octo STS asks for; `sub` and `job_workflow_ref` do not depend on it.
# Nothing here talks to Octo STS: this requests the run's token from GitHub's own endpoint and decodes it locally.
name: oidc-claims-probe

on:
  pull_request:
  pull_request_target:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Request this run's OIDC token and print ONLY the decoded claims
        env:
          AUDIENCE: octo-sts.dev
        run: |
          set -euo pipefail
          response=$(curl -sS --fail --max-time 30 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?no id-token permission: the runner supplied no request token}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL:?no id-token permission: the runner supplied no request URL}&audience=${AUDIENCE}")
          token=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8")).value)' <<<"$response")
          echo "::add-mask::$token"
          export TOKEN="$token"
          node -e '
            const claims = JSON.parse(Buffer.from(process.env.TOKEN.split(".")[1], "base64url").toString("utf8"));
            const shown = ["sub", "job_workflow_ref", "job_workflow_sha", "workflow_ref", "workflow_sha", "ref", "sha", "event_name",
              "base_ref", "head_ref", "repository", "actor", "aud", "iss"];
            for (const name of shown) console.log(`OIDC-CLAIM ${name} = ${JSON.stringify(claims[name] ?? null)}`);
          '
