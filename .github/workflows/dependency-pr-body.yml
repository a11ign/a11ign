name: dependency-pr-body

# A DEPENDENCY PULL REQUEST GETS A NARROW, DECLARED WAY THROUGH THE TWO BODY CHECKS (#3137, ADR 0041 decision 4).
#
# `ci.yml`'s `acceptance` job refuses a body with no `Acceptance:` section, and the `Closes` declaration is
# merge-blocking too; Dependabot writes neither. Neither check is bypassed (the rulings stand): this workflow writes
# the body they read, so they pass for what they are.
#
# ## `pull_request_target`, and why that is safe HERE and nowhere else
#
# It is the only trigger whose token may WRITE to a pull request Dependabot opened (`pull_request` gets a read-only
# token). The danger of the trigger is running the pull request's own code with that token, so this file does not:
#
#   - the job runs ONLY for Dependabot (`github.actor` AND the pull request's author), so a stranger's pull request
#     never reaches it;
#   - NO step checks anything out, so no byte of the pull request head is ever on the runner;
#   - the title reaches the shell as an environment variable (`PR_TITLE`), never as `${{ }}` text in the script, and
#     is read only through the fixed pattern below; the pull request's BODY is not read at all, and is replaced.
#
# `dependency-pr-body.test.ts` pins each of these and runs the script below against a stub `gh`.
#
# ## What it writes, and what it will not
#
# A FIXED fragment: the title's package and versions (through the pattern, nothing else from the title), a
# `Closes: none` declaration and the repository's own manifest verification as the `Acceptance:` command. Dependabot's
# original body (release notes quoting `Closes #123` lines of OTHER projects) is deliberately dropped: kept, it could
# close a row here or duplicate the `Acceptance:` section.
#
# It writes NOTHING, and says why in the log, for a MAJOR bump (a `0.x` minor counts: below 1.0 it is the breaking
# one), for a pull request touching anything but the manifests and the lockfile, or for one touching an OWNED path
# (`packages/nvda-worker/package.json`: the NVDA driver). An owned path's body must state `CAPTURE_PROTOCOL_VERSION`,
# `provisionRevision`, `environmentKey` and `weights`, and a fixed fragment cannot truthfully say `unchanged` for them, so
# it states none of the four. The list is `docs/owned-path-facts.json`, the orchestrator's data, read through the API at
# the BASE commit (never the head, so still nothing of the pull request on the runner) rather than copied here; a list
# that cannot be read is "could not ask", which writes nothing. That pull request keeps Dependabot's body, `acceptance`
# refuses it, and it waits like any other (design 3 of the row, as ruled on the row 2026-10-03).
#
# The `Acceptance:` command spells `--config=<path>`, not `--config <path>`, on purpose: `entry-points.test.ts` reads every
# workflow for a whitespace-preceded `scripts/*.mjs` and demands an entry guard of whatever it finds, and
# `rstest.config.ts` is a config file, not an entry point.
#
# ## The edit has to be seen by `ci.yml`
#
# `acceptance` reads the body in `ci.yml`'s `pull_request` event, whose types include `edited`. An edit made with the
# default `GITHUB_TOKEN` fires NO workflow, so `acceptance` would keep reporting the body Dependabot opened with. The PATCH is
# therefore made with an Octo STS token (#4197): an installation token, which does fire `edited`, minted for exactly this workflow
# as it is on `main` and holding `pull_requests: write` and nothing else (`.github/chainguard/dependency-pr-body.sts.yaml`). There is
# no fallback to `GITHUB_TOKEN`: a body written without the event is a body `acceptance` never re-reads, so a failed mint fails the
# job instead. The READS (the file list, the owned-path list at the base commit) use `GITHUB_TOKEN` and never the minted one.
#
# `id-token: write` is held by a job that checks out and runs NO pull-request code: that is what makes it safe on this trigger.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  body:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    steps:
      - name: Mint a token that may edit pull requests, for this workflow as it is on main
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: dependency-pr-body
      - name: Write the fixed body fragment onto a minor or patch bump of the manifests
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          EDIT_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          set -euo pipefail
          title_pattern='^deps: bump ([@A-Za-z0-9._/-]+) from (([0-9]+)\.([0-9]+)[0-9A-Za-z.+-]*) to (([0-9]+)\.([0-9]+)[0-9A-Za-z.+-]*)( in /[A-Za-z0-9._/-]*)?$'
          allowed_files='^(package\.json|packages/[^/]+/package\.json|pnpm-lock\.yaml)$'
          if [[ ! "$PR_TITLE" =~ $title_pattern ]]; then
            echo "::notice::not auto-declared: the title is not 'deps: bump <package> from <x.y.z> to <x.y.z>', so it waits like any other pull request"
            exit 0
          fi
          name="${BASH_REMATCH[1]}"; old="${BASH_REMATCH[2]}"; new="${BASH_REMATCH[5]}"
          old_major="${BASH_REMATCH[3]}"; old_minor="${BASH_REMATCH[4]}"; new_major="${BASH_REMATCH[6]}"; new_minor="${BASH_REMATCH[7]}"
          if [ "$old_major" != "$new_major" ] || { [ "$old_major" = 0 ] && [ "$old_minor" != "$new_minor" ]; }; then
            echo "::notice::not auto-declared: $name goes from $old to $new, a major bump, so it waits for a human like any other pull request"
            exit 0
          fi
          files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          if [ -z "$files" ] || grep -qvE "$allowed_files" <<< "$files"; then
            echo "::notice::not auto-declared: $name touches something other than the manifests and the lockfile, so it waits like any other pull request"
            exit 0
          fi
          owned="$(gh api "repos/$REPO/contents/docs/owned-path-facts.json?ref=$BASE_SHA" -H 'Accept: application/vnd.github.raw+json' --jq '.owned[]' || true)"
          if [ -z "$owned" ]; then
            echo "::notice::not auto-declared: the owned-path list could not be read at the base commit, and not being able to ask is not a pass"
            exit 0
          fi
          while IFS= read -r changed; do
            while IFS= read -r prefix; do
              if [[ "$changed" == "${prefix%/}" || "$changed" == "${prefix%/}"/* ]]; then
                echo "::notice::not auto-declared: $name touches an owned path ($prefix), whose body must state facts a fixed fragment cannot truthfully state, so it waits for a human"
                exit 0
              fi
            done <<< "$owned"
          done <<< "$files"
          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          Dependency update by dependabot[bot] (ADR 0041): bump $name from $old to $new.

          Acceptance:
          pnpm exec rstest run --config=scripts/rstest/rstest.config.ts --include packages/guards/src/one-package-manager.test.ts

          Closes: none -- dependency update by dependabot[bot] (ADR 0041)
          EOF
          GH_TOKEN="$EDIT_TOKEN" gh api --method PATCH "repos/$REPO/pulls/$PR_NUMBER" -F body=@"$body_file" --silent
          echo "::notice::wrote the fixed body fragment for $name $old -> $new"
