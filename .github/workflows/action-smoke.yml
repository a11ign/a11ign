# Does the ACTION work? Nothing verified this before, and the action is the entire adoption path.
#
# `capture-regression.yml` runs on Windows and calls the harness directly, re-implementing the action's
# setup by hand. So the steps in `action.yml` — NVDA install, Speech Viewer off, Edge first-run
# suppression, the local scorer — had never once been executed as written, and the two step lists can
# drift with nothing to notice. A consumer's first experience of this project runs code no test touches.
#
# This job is deliberately a CONSUMER's usage: `uses: ./`, inputs only, no repo knowledge. If it passes,
# a stranger can add five lines to a workflow and get a report. If it fails, nothing else about the
# release matters.
name: action-smoke

on:
  # RELEASE-TIME ONLY, AND NOTHING ELSE — chairman's direction, 2026-09-06. This ran on every push to
  # `main` under the paths below (and, before that, on every `agent/**`/`lead/**` push with no `branches:`
  # filter at all, a 10-minute Windows job on ordinary branch work). Both were wrong for the same reason:
  # `release.yml`'s own header already states that "`action-smoke` must have SUCCEEDED for this exact
  # commit" is what gates a publish, so running it on every commit was spending Windows minutes on a
  # question only the shipping sha ever needs answered. `workflow_call` is what lets `release.yml` run this
  # as a JOB against that exact sha rather than merely querying a separately-triggered run; `workflow_dispatch`
  # keeps the on-demand case. No `paths:` filter is possible or needed under either trigger — this no
  # longer runs on a diff at all, so which files a diff touched is not a question this workflow answers.
  workflow_call:
  workflow_dispatch:

jobs:
  consumer:
    # Windows because NVDA is Windows-only; the action refuses other runners by design.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # `packages/lab/` left this repository for a11ign/lab (#3505), and the two assertions below are its script. It is LAID at the tag
      # `layers.json` declares, which needs git and nothing installed: this job installs nothing before the action runs.
      - name: Lay a11ign/lab's scripts where the assertions read them
        shell: bash
        run: node scripts/lay-layer.ts lab

      # TWO runs, each guarding one DIRECTION, because for an accessibility tool the two failures are not
      # symmetrical. A missed finding costs a user; an invented one is an accusation someone may be
      # challenged over. Both pages are published by W3C WITH their own conformance claim, so the expected
      # answer is not our opinion.
      #
      # Run 1 — a page W3C publishes as fully WCAG 2.0 AA conformant. It must produce NO 1.1.1 ASSERTION.
      # This is a live regression test for a real defect: Chromium exposes a CSS `list-style-image` bullet
      # as an unnamed role=image node, and the census counted two of them, so this tool accused a
      # conformant page of having images with no text alternative. Measured 0 rule findings after the fix,
      # with probing ON.
      - name: Run a11ign as a consumer would
        id: witness
        uses: ./
        with:
          url: https://www.w3.org/WAI/demos/bad/after/survey.html
          task: "Submit the survey without filling it in and see what is announced."
          judge-backend: local
          # EXPLICIT since 2026-10-08 (#4089): the Action's default is now off, so this run asks for probing, as an
          # adopter who wants 3.3.1 and 4.1.3 does, and still proves that probing works when asked for. Run 3 is the
          # mirror: no input, nothing activated.
          probe-forms: "true"

      - name: A conformant page must produce a report, an interaction, and NO 1.1.1 accusation
        shell: bash
        run: |
          path="${{ steps.witness.outputs.result-json }}"
          if [ -z "$path" ]; then echo "::error::the action produced no result-json output" >&2; exit 1; fi
          test -s "$path" || { echo "::error::result-json path '$path' is empty or missing" >&2; exit 1; }
          # --expect-activation because this run SETS `probe-forms: "true"`: a probing run that operates nothing
          # means probing silently regressed and every 3.3.1/4.1.3 finding is unreachable while this
          # job stays green. --forbid-wcag because W3C publishes this page as conformant, so an ASSERTED
          # 1.1.1 (outcome `failed`) is a false accusation by their own claim. A REFERRED one (`cantTell`,
          # the scorer triaging) is not, and it varied capture to capture on this page (#3373): it is
          # logged as a notice and does not fail the job. --require-rule-layer because `axe` DEFAULTS
          # on too, and `ruleBased: null` on a run that never opted out is the axe layer silently failing
          # to launch — exactly what happened on every Action run before this assertion existed.
          node packages/lab/src/harnesses/assert-action-report.ts "$path" \
            --expect-activation --forbid-wcag=1.1.1 --require-rule-layer

      # The POSITIVE CONTROL for run 3's zero: the same count, on the same page and task, demanded to be more than zero when
      # probing is asked for. A zero on run 3 means nothing if this count would also be zero with probing on.
      - name: A probing run must press something probe-forms owns
        shell: bash
        run: |
          node -e '
            const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); const i = r.capture?.interaction ?? r.interaction ?? {};
            const pressed = (i.formChanges ?? []).filter((c) => c.kind !== "route");
            console.log("probe-forms presses: " + pressed.length);
            if (pressed.length === 0) { console.error("::error::probe-forms: \"true\" pressed nothing, so run 3\u0027s zero proves nothing"); process.exit(1); }
          ' "${{ steps.witness.outputs.result-json }}"

      # Run 2 — the mirror, and the reason run 1 cannot stand alone. A guard that silences real findings
      # would pass run 1 perfectly. This is W3C's published INACCESSIBLE demo, whose home page exposes 33
      # images with no accessible name, so 1.1.1 MUST fire. Measured: 8 rule findings, including
      # "33 of 39 images expose no accessible name".
      - name: The inaccessible demo must still be caught
        id: inaccessible
        uses: ./
        with:
          url: https://www.w3.org/WAI/demos/bad/before/home.html
          task: "Find the main navigation and reach the survey."
          judge-backend: local

      - name: 1.1.1 must fire on the page that really fails it
        shell: bash
        run: |
          path="${{ steps.inaccessible.outputs.result-json }}"
          test -s "$path" || { echo "::error::the inaccessible run produced no result-json" >&2; exit 1; }
          node packages/lab/src/harnesses/assert-action-report.ts "$path" --require-wcag=1.1.1 --require-rule-layer

      # Run 3 — the default, and the reason run 1 cannot stand alone on the other side (#4089). Run 1 proves probing
      # works when ASKED FOR; this proves a run that asks for nothing presses nothing. It is run 1's page and task
      # with NO `probe-forms` input, because that task names a button ("Submit the survey"): the exact case where the
      # old default (ON) pressed it, and the case an adopter pointing the Action at a staging app is in. A green run 1
      # with the default still ON would pass every assertion above, so this is the one that fails if it regresses.
      - name: A run with no probe-forms input
        id: default
        uses: ./
        with:
          url: https://www.w3.org/WAI/demos/bad/after/survey.html
          task: "Submit the survey without filling it in and see what is announced."
          judge-backend: local

      # WHAT `probe-forms` OWNS, and nothing else (measured on this run, 37755450191, whose first form of this step counted
      # `activationCount` and failed with 3 on the page below): a default run still follows the page's first link
      # (`probe-navigation`, a `formChanges` entry of kind `route`) and presses Enter on collapsed combo boxes and
      # disclosures (`stateChanges`, no `probe-forms` gate: SECURITY.md). Neither is a submit or a button the task names,
      # and both are separate, documented, on-by-default probes. So this counts the `formChanges` entries that are NOT
      # a route. `kind` is optional on old captures and "cannot say" is not "not a submit", so a missing kind counts too.
      # The route and disclosure counts are printed, so what a default run still does stays visible in the log.
      # The script is a11ign/lab's and has no such flag, so the check is written here. Its positive control is the step
      # after run 1, which runs the same count and demands more than zero on the same page and task.
      - name: A default run must press NOTHING that probe-forms owns
        shell: bash
        run: |
          path="${{ steps.default.outputs.result-json }}"
          test -s "$path" || { echo "::error::the default run produced no result-json" >&2; exit 1; }
          node -e '
            const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); const i = r.capture?.interaction ?? r.interaction ?? {};
            const pressed = (i.formChanges ?? []).filter((c) => c.kind !== "route");
            const routes = (i.formChanges ?? []).length - pressed.length;
            console.log("probe-forms presses: " + pressed.length + "; first links followed: " + routes + "; disclosures pressed: " + (i.stateChanges ?? []).length);
            if (pressed.length !== 0) { console.error("::error::a default run pressed " + pressed.length + " control(s) probe-forms owns: " + pressed.map((c) => c.control + " [" + c.kind + "]").join("; ")); process.exit(1); }
          ' "$path"

      # NAMED BY THE PATH THE ACTION ALWAYS WRITES, never by the failing step's OUTPUT.
      #
      # This read `steps.witness.outputs.result-json`, which that step sets on its LAST line — so when it
      # failed, the output was never set, the expression rendered empty, and this step died with
      # "Input required and not supplied: path". A failure handler that fails precisely when it is needed:
      # every one of the 85 consecutive red runs discarded the report that would have explained it, and
      # `if-no-files-found: ignore` meant it did so quietly even on the runs where `path` was non-empty.
      #
      # `action.yml` writes to `$RUNNER_TEMP/a11ign-result.json`, a constant assigned BEFORE the CLI
      # is invoked, so the file exists whatever happens next — which is the whole point of collecting it.
      # The summary rides along for the same reason. `warn` rather than `ignore`: if this now collects
      # nothing, that is itself a finding about the run, and silence is what hid the bug for 85 runs.
      #
      # NOTE, not fixed here: all three `uses: ./` runs write the SAME filename, so each overwrites the one before.
      # That only loses information when run 1 passed and run 2 failed; naming them apart needs an input
      # on `action.yml`, which is a consumer-facing change and does not belong in a workflow fix.
      - name: Keep the report when this fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: action-smoke-report
          path: |
            ${{ runner.temp }}/a11ign-result.json
            ${{ runner.temp }}/a11ign-summary.md
          if-no-files-found: warn
