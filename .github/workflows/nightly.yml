# nightly -- the checks that are properties of TIME, not of a diff, run once a day (#901, The CI Reset, step 1).
#
# WHY THIS FILE EXISTS. Measured 2026-09-09 UTC: 3,317 workflow runs for 193 merges. `ready-label-audit`
# alone was 1,040 of them with zero successes -- it re-fired on every label event and cancelled itself
# (#862) -- and four push-triggered checks were another 777. None of the five asks a question whose answer
# changes when a commit lands. So:
#
# - `coverage` (below, unchanged) was already nightly; it moved here from `coverage.yml` so there is ONE
#   scheduled file to read.
# - `ready-audit` runs `npm run ready:audit` once a night instead of hourly plus on every issue event.
#   `ready-label-audit.yml` is DELETED, not renamed: its hourly-plus-event shape was the livelock, and its
#   findings are the tracker owner's, who reads them once a day and runs the script by hand for a same-day
#   answer. Do not re-add an `issues:` trigger here; that is the 1,040-run shape.
# - The three liveness watchdogs (token, board editions, workflow-run) are NOT here. They must run on push,
#   never on a cron, because GitHub disables scheduled workflows repository-wide after 60 days of
#   inactivity and a scheduled watchdog dies with the thing it watches -- `board-liveness.test.ts` pins
#   this. They are three continue-on-error steps in `trunk.yml`'s `watchdogs` job, which already
#   runs on every push to main, so they cost no workflow runs of their own.
# - `board-report.yml` and `board-summary-check.yml` stay separate: they are gated on London's clock and
#   `board-schedule.test.ts` pins the hours.
#
name: nightly

# NIGHTLY COVERAGE, OFF THE PR PATH -- chairman's direction, 2026-09-06, follow-up to #133/#140. `npm run
# coverage` re-runs the WHOLE suite under rstest (`@rstest/coverage-v8`, #1320) against `.c8rc.json`'s 78%
# threshold. Before the move to rstest (#1320), it ran under c8, measured at 154s of
# `ci/ts`'s 269s on a one-package PR -- most of it re-testing packages that PR could not have touched. It
# left the PR job entirely (`ci.yml`'s own header explains the split), but the threshold still needs
# checking regularly or it rots silently: a package could lose coverage over several PRs, each one only
# ever measuring its own small package-scoped run, with nothing left watching the repo-wide number.
#
# SCHEDULED HERE, AND ALSO GATED INTO `release.yml` BEFORE ANY PUBLISH -- belt and suspenders, the same
# shape `board-liveness.yml` and its own watchdog already use for the identical reason: a schedule ALONE
# can be silently disabled by GitHub after 60 days with no repository activity, and a coverage regression
# going unnoticed for that long is exactly the risk this exists to catch. It is not urgent enough to
# justify blocking every PR merge on it (which is the whole reason it left the PR path), so it does not
# push-trigger and is not on `push-trigger-allowlist.test.ts`'s allowlist -- nothing here is a watchdog for
# ANOTHER schedule, this schedule IS the thing being relied on, and its own redundancy is the release-time
# run rather than a second trigger.
on:
  schedule:
    # #965: OFF THE HOUR. Four consecutive days (09-09..09-12) the :00 schedule started hours late or not at
    # all -- GitHub's shared cron queue is worst at the top of the hour -- and ceo dispatched by hand. The
    # nightly runs at 06:17 UTC; the org watch (#912) runs hourly at :37.
    - cron: "17 6 * * *"
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write     # the failure comment below, on #169

jobs:
  coverage:
    if: github.event.schedule != '37 * * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - id: ci
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: build
        run: npm run build
      # GH_TOKEN: `board-style.test.ts` and `row-claim.test.ts`'s live `fetchLabels` shell out to real `gh`
      # calls against this repo's own Issues -- read-only, and `github.token` already has that scope for
      # the repo the workflow runs in. `npm run coverage` runs the whole suite under rstest, so it reaches
      # both.
      #
      # CAPTURED TO A FILE, NOT JUST THE ACTIONS LOG -- `scripts/coverage-failure-classifier.mjs` (#169)
      # reads this to tell a real threshold miss from a test failure from nothing at all. `set -o
      # pipefail`, because `| tee` on its own reports the PIPELINE's exit status as `tee`'s (always 0) --
      # this file's own project already lost real time to that shape once (CLAUDE.md's own rule: "never
      # pipe a command whose exit status you intend to read").
      - id: coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          npm run coverage 2>&1 | tee coverage-output.log

      # A COMMENT SAYING "coverage failed" IS NOT A FINDING (#169) -- `if: failure()` here fires
      # identically whichever of `ci`/`build`/`coverage` broke, and the three need three different
      # responses: an infrastructure failure means coverage was never measured at all; a test failure is a
      # TEST regression, not a coverage one; only a real c8 threshold miss is what this tracking issue
      # exists to catch. `scripts/coverage-failure-classifier.mjs` reads each step's own `outcome` plus the
      # coverage step's captured output and says which. One comment per failing run, not per day, because
      # a repeating warning is a warning people filter -- `github.run_id` in the link is what makes a
      # rerun of the SAME failure distinct from tomorrow's fresh one without spamming the issue on a retry
      # of the same commit.
      - name: Coverage failed -- classify WHY, and say so on the tracking issue rather than just the log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(node scripts/coverage-failure-classifier.mjs \
            --ci-outcome=${{ steps.ci.outcome }} \
            --build-outcome=${{ steps.build.outcome }} \
            --log=coverage-output.log \
            --run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          gh issue comment 169 --body "$BODY"

  # #1135: THE NIGHTLY-ONLY TEST POPULATION. `npm test` (the PR path) and `npm run coverage` (above) resolve
  # the SAME glob, `packages/*/src/**/*.test.ts`, and the runner accepts no exclusion -- so until this job
  # existed there was nowhere a guard could go that the PR path did not also pay for, and #908's plan to
  # move a converted guard's run-property residual (its vacuity check and exemption table) off the PR path
  # had no destination. `packages/*/nightly/**/*.test.ts` is that destination: outside `src/`, so the PR
  # glob cannot see it by construction, typechecked by tsconfig, run here with the same floor-checked runner.
  # A SEPARATE JOB, not a step in `coverage`, so a nightly-only failure is its own red and never classified
  # by #169's coverage classifier as a coverage miss. No `continue-on-error`: a residual that lands where the
  # run ignores it is worse than one left on the PR path, and `nightly-only-path.test.ts` pins that.
  nightly-only:
    if: github.event.schedule != '37 * * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm run build
      - name: Run every test in the nightly-only population, refusing an empty one
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run test:nightly

  # #2120: THE LIVE RULESET READ, RUN UNATTENDED. Until this job existed, BOTH of
  # `branch-protection.test.ts`'s live reads were opt-in, nothing anywhere set either flag, and the skip
  # that makes the silence green prints `NOT RUN` and PASSES -- so #2022's behavioural read-back of the
  # approving-review requirement had never once run except by hand. The guard needs no change for this;
  # what was missing was a caller.
  #
  # WHICH IDENTITY, AND WHY IT IS NOT `github.token` (#2120's "settle this before building").
  # `BINDS_ME` is identity-scoped by construction -- `current_user_can_bypass` answers FOR THE ASKING
  # IDENTITY ONLY. So the read is worth exactly as much as the subject it asks about. `${{ github.token }}`
  # is the `github-actions` app, which authors nothing and merges nothing here: a nightly `BINDS_ME` under
  # it would be a TRUE STATEMENT ABOUT THE WRONG SUBJECT, and it would read in the log exactly like the
  # useful one. `A11IGN_BOT_TOKEN` is the identity that actually completes every merge -- `trunk.yml`'s own
  # header ("since #416 every merge is completed with the A11IGN_BOT_TOKEN PAT"), and measured 2026-09-23 on
  # the three most recently merged PRs (#2109, #2112, #2115): `merged_by` is `DanBeckDev` on all three,
  # while the PRs themselves are authored by `a11ign-ai-workers`. `DanBeckDev` is also the identity #2022
  # singled out as `bypass_pull_request_allowances`'s sole entry, so it is precisely the subject whose
  # exemption state the requirement turns on.
  #
  # SO THERE IS NO FALLBACK, AND THAT IS THE DIFFERENCE FROM EVERY OTHER JOB IN THIS FILE. `ready-audit`
  # below falls back to `GITHUB_TOKEN` with a warning because a degraded answer about the tracker is still
  # an answer about the tracker. Here a fallback would silently SWAP THE SUBJECT and certify the wrong one,
  # which is the exact defect the paragraph above refuses. A missing secret is CANNOT_TELL, and
  # CANNOT_TELL fails the job.
  #
  # THE ADMIN-ONLY HALF IS DELIBERATELY LEFT OUT, AND A LATER READER MUST NOT ADD IT.
  # `A11Y_CHECK_BRANCH_PROTECTION=1` reads `branches/main/protection`, which needs repository ADMIN.
  # Measured 2026-09-22T23:05Z as `a11ign-ai-workers`: that endpoint 404s while `branches/main.protected`
  # reads `true` -- so the 404 is FORBIDDEN, not ABSENT. Scheduling it here would 404 every night against a
  # branch that IS protected, and the next reader would conclude `main` is unprotected. It stays the
  # hand-run read it is, and the guard's own `NOT RUN` line names the command that makes it.
  #
  # `--disableConsoleIntercept`, AND THE REASON IS MEASURED. The assertion below is on a line the guard
  # PRINTS, because a green exit is not a pass here (see the step). rstest intercepts `console.log` and its
  # reporter drops it: measured 2026-09-23 at `a82ddbc1c`, this exact command WITHOUT the flag exits 0 with
  # 39/39 passed and ZERO occurrences of `LIVE PASS` -- or of `NOT RUN` -- anywhere in its output, so a step
  # built on it could not tell the pass from the skip, which is this row's whole subject. With the flag,
  # both lines appear.
  #
  # AND THE CONFIG PATH IS NOT SPELLED HERE -- it is READ OUT of the one file that owns it. `entry-points.test.ts`
  # scans every workflow's text, unstripped, for a whitespace-preceded `scripts/…\.mjs` and reads it as an
  # invocation; rstest's own config module (under `scripts/rstest`) is MEANT to be imported, so it carries no
  # entry guard and the scan reports it unguarded. Measured on this very branch: spelling that path after
  # `--config` turned `ts / run` red at `26f4d80f8` (run 35854391590) on exactly that assertion. The scan does
  # not strip comments either -- a whitespace-preceded mention in prose is matched on identical terms -- so
  # this comment names rstest's config DIRECTORY and not the file.
  # Guarding the config module would be the wrong fix -- `reusable-board.yml` already ruled that, in its own
  # comment, and chose the same answer this step does: keep the path OUT of the workflow. `RSTEST_CONFIG` is
  # exported by `assert-glob-not-empty.mjs` for precisely this ("resolved from this file so the caller's cwd
  # cannot change it"), so reading it here is the intended use and the two cannot drift apart.
  mainRulesetBinds:
    if: github.event.schedule != '37 * * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The guard itself imports nothing built, but the step below reads `RSTEST_CONFIG` out of
      # `assert-glob-not-empty.mjs`, which imports `@a11ign/worker-fleet/cli-flags` -- a package export
      # resolving to `dist/`, which `--ignore-scripts` does not produce and which this repo does not track.
      # Every other nightly job that runs tests (`coverage`, `nightly-only`, `doc-report`) builds for the
      # same reason.
      - run: npm run build
      - name: Ask GitHub whether main's `pull_request` rule binds the identity that merges here
        env:
          A11IGN_BOT_TOKEN: ${{ secrets.A11IGN_BOT_TOKEN }}
        run: |
          set -o pipefail
          if [ -z "$A11IGN_BOT_TOKEN" ]; then
            echo '::error::CANNOT_TELL: A11IGN_BOT_TOKEN is not set, so the ruleset read could not be made AS THE MERGING IDENTITY, and NOTHING WAS READ. Deliberately not falling back to github.token: that reads current_user_can_bypass for the github-actions app, which merges nothing here -- a true statement about the wrong subject. This is not a pass. See #2120.'
            exit 1
          fi
          export GH_TOKEN="$A11IGN_BOT_TOKEN"
          # Read the runner's config path out of its single owner rather than re-typing it here; see the
          # block above the job for why this workflow must not spell it.
          #
          # THE EXIT CODE IS THE SIGNAL, NOT THE EMPTY STRING, and that distinction was measured rather than
          # assumed: `console.log(m.RSTEST_CONFIG)` on a RENAMED export prints the four characters
          # `undefined`, which is not empty, so a `-z` test alone let it through and rstest died on
          # `Cannot find config file: <repo>/undefined` -- red, but on a message that names neither the
          # cause nor this job. So the reader exits non-zero when the export is missing, and `|| …=""`
          # converts that into the empty string the refusal below is written for -- without it the runner's
          # own `bash -e` aborts the step before the refusal can print.
          RSTEST_CONFIG="$(node -e 'import("./packages/guards/src/assert-glob-not-empty.mjs").then((m) => { if (m.RSTEST_CONFIG) console.log(m.RSTEST_CONFIG); else process.exit(1); })')" || RSTEST_CONFIG=""
          if [ -z "$RSTEST_CONFIG" ]; then
            echo '::error::CANNOT_TELL: could not read RSTEST_CONFIG from packages/guards/src/assert-glob-not-empty.mjs, so the runner was never started and NOTHING WAS READ. The export was renamed, or the build did not run. This is not a pass. See #2120.'
            exit 1
          fi
          A11Y_CHECK_MAIN_RULESET=1 npx rstest run --config "$RSTEST_CONFIG" \
            --include packages/lab/src/packaging/branch-protection.test.ts \
            --disableConsoleIntercept 2>&1 | tee ruleset-read.log
          # A GREEN EXIT IS NOT A PASS, and that is the defect this job exists to end one layer up. Every
          # "could not ask" arm inside that guard logs its reason and RETURNS, so an unreadable
          # `rules/branches/main` -- or the flag never reaching the test at all -- exits 0 having
          # established nothing. The LIVE PASS line is printed only on the far side of the BINDS_ME
          # assertion, so requiring it is what makes a skip red.
          grep -q 'LIVE PASS (no admin required)' ruleset-read.log || {
            echo '::error::CANNOT_TELL: the run exited green but never printed its LIVE PASS line, so the live ruleset read did not happen and nothing was certified. The log above names which read was unavailable -- look for a "could not be read" line naming the endpoint, or a "SKIPPED" line. This is not a pass. See #2120.'
            exit 1
          }

  ready-audit:
    if: github.event.schedule != '37 * * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit the tracker's labels once a day
        env:
          A11IGN_BOT_TOKEN: ${{ secrets.A11IGN_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$A11IGN_BOT_TOKEN" ]; then
            export GH_TOKEN="$A11IGN_BOT_TOKEN"
          else
            export GH_TOKEN="$GITHUB_TOKEN"
            echo "::warning::A11IGN_BOT_TOKEN is not set -- GITHUB_TOKEN cannot resolve a user-owned ProjectV2, so the board-membership check will report as unable to run. See #416."
          fi
          npm run ready:audit

  # #948 (The CI Reset, step 3 of the doc-guard triage #905): the doc cross-reference REPORT, once a night,
  # as one comment. Until #954 retires them, the ~14 doc cross-reference guards still run on every PR; this
  # comment is their replacement, and #954 may retire them only after this step has posted once with
  # per-guard examined counts (#928's rule: no watcher retires before its replacement has reported).
  # The report script prints markdown, always exits 0 and never calls `gh` itself; posting is this step's.
  # It fetches ~21 external URLs (`check-transfer-urls`), hence the timeout. Until #63 lands, the 21
  # `a11ign/a11ign` URLs answer 404 and are named every night: expected, not a failure. The comment goes
  # on #928 (the org's nightly reading) until #912 creates the nightly issue; then change the number.
  doc-report:
    if: github.event.schedule != '37 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm run build
      - name: Write the doc cross-reference report and post it as one comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/doc-cross-reference-report.mjs > /tmp/doc-report.md
          gh issue comment 928 --body-file /tmp/doc-report.md

  # #912: THE ORG'S CLOCK, durable. `org-watch.mjs` reads main's colour (and, as its remaining reads land,
  # the queue and utilisation) and exits QUIET or ATTENTION; on ATTENTION its report is posted as one
  # comment on #928, the org's reading issue. Silent when clean, but never silent because it did not look:
  # a CANNOT ASK is an ATTENTION. Hourly at :37, on the second cron above; the nightly jobs skip that cron.
  # #417's SURVIVING HALF, moved here from `trunk-sweep.yml` by #909 (2026-09-12). Two backstops, hourly on the
  # `:37` cron rather than every 15 minutes: if main's tip carries zero check runs, trigger a real `trunk.yml`
  # run against it; and close any row a merged PR declared that `trunk.yml`'s own `closeRows` missed. Since #416
  # merges are made with a PAT and fire push, so both are backstops for the scheduler-and-token failures the
  # org has measured, not the primary path. The 120-minute window against an hourly cron is deliberate overlap,
  # pinned by `trunk-sweep.test.ts`: a single missed tick must not lose a row. Independent jobs: one failing
  # must not block the other.
  gateSweep:
    if: github.event.schedule == '37 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: If main's tip has zero check runs, trigger a real gate run against it
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node packages/agent-org/src/trunk-sweep.mjs
  closeRowsSweep:
    if: github.event.schedule == '37 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Close any row a merged PR declared that the push-time job missed
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node packages/agent-org/src/close-rows-sweep.mjs --window=120
  watch:
    # Runs on the :37 cron AND on workflow_dispatch, so the one job whose failure mode is silence can be
    # asked to speak by hand (worker-judge's review of #1068).
    if: github.event.schedule == '37 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Read the org and post only if something needs attention
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node packages/agent-org/src/org-watch.mjs > /tmp/org-watch.md 2>&1; rc=$?
          set -e
          cat /tmp/org-watch.md
          if [ "$rc" -ne 0 ]; then gh issue comment 928 --body-file /tmp/org-watch.md; fi

