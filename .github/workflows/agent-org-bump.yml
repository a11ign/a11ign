name: agent-org-bump

# A11IGN'S `agent-org` PIN FOLLOWS EACH RELEASE BY ITSELF: ONE `deps:` PULL REQUEST PER RELEASE, LOCKFILE ONLY (#3450,
# chairman's direction 2026-10-04; decided by `ceo` on the row).
#
# `package.json` declares `github:a11ign/agent-org#semver:^0.7.0`. Dependabot opened no pull request for it (0 titles
# matched `bump agent-org`) and its schedule is daily anyway, so the lockfile moved only as a side effect of an unrelated
# dependency pull request (#3244). This is that move made on purpose: read the newest release tag inside the declared
# range, and when the lockfile does not already resolve its commit, run `pnpm update agent-org --lockfile-only` on ONE
# fixed branch and open or update ONE pull request. `agent-org-bump-workflow.test.ts` pins every choice below.
#
# ## What it will not do (the review requirement on `main` is not negotiable, `.claude/rules/main-review-requirement.md`)
#
# It opens a pull request and stops. It never approves one, never queues a merge, never edits protection and never touches
# a protection exemption: `a11ign-bot` approves, as it does every pull request here, and the queue merges through the account
# that merges the rest. So "within minutes" is bounded by the review, and the row measures open-to-merge rather than promise it.
#
# ## Why the pull request is opened with `A11IGN_BOT_TOKEN`
#
# A pull request opened, or a branch pushed, with the default workflow token starts NO workflow (GitHub's own rule, against
# loops), so `ci` would never report and `gate` could never go green. `release.yml`'s version pull request uses the same
# token for the same reason, and it is the token `auto-arm.yml` arms with. There is therefore no fallback to the default
# token here: without the secret the run says so and fails, rather than open a pull request that can never merge.
#
# ## A release OUTSIDE the declared range
#
# `^0.7.0` stops below 0.8.0. Moving the range is a deliberate row (#3244), never this workflow's. When NO release lies
# inside the range the run fails red with the reason in its summary; when one does, the in-range pull request is still
# right (the lockfile entry is allowed to move within the range) and the newer release is named in a warning annotation.
#
# ## Idempotence
#
# The branch name is fixed, so a second run updates the open pull request instead of opening another. When the open pull
# request's branch already resolves the chosen commit, the run pushes nothing and edits nothing: a new commit on every
# tick would restart `ci` every ten minutes.
#
# ## Cadence
#
# A scheduled run is best-effort: GitHub may delay it under load, so ten minutes is the target and not a promise. The
# lead time (tag commit to pull request open, then open to merge) is measured on the row. A `repository_dispatch` from the
# release job of `agent-org` would be faster, but needs a write token for this repository inside THAT repository's
# workflow, which is a change in another repository and its own row if the schedule proves too slow.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read          # the checkout; every write below is made with A11IGN_BOT_TOKEN, never the default token

concurrency:
  # Two runs would race the branch push; the second waits and then finds the pull request already at the newest tag.
  group: agent-org-bump
  cancel-in-progress: false

env:
  AGENT_ORG_URL: https://github.com/a11ign/agent-org
  BRANCH: deps/agent-org

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse without the bot token, which a pull request needs to be built on
        env:
          A11IGN_BOT_TOKEN: ${{ secrets.A11IGN_BOT_TOKEN }}
        run: |
          if [ -z "$A11IGN_BOT_TOKEN" ]; then
            echo "::error::A11IGN_BOT_TOKEN is not set. A pull request opened with the default token gets no ci run and can never merge, so this does not fall back to it."
            exit 1
          fi
      - uses: actions/checkout@v7
        with: { ref: main, token: "${{ secrets.A11IGN_BOT_TOKEN }}" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Read the release tags of agent-org
        run: |
          set -euo pipefail
          git ls-remote --tags "$AGENT_ORG_URL" > "$RUNNER_TEMP/tags.txt"
      # Pure over three files, so the test runs this very script with the tags and the lockfile injected. The tags are
      # `git ls-remote --tags` lines: an annotated tag appears twice, and the `^{}` line is the commit it points at.
      - name: Choose the newest release inside the declared range
        id: choose
        env:
          TAGS_FILE: ${{ runner.temp }}/tags.txt
          PACKAGE_JSON: package.json
          LOCKFILE: pnpm-lock.yaml
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from "node:fs";

          const STABLE = /^v(\d+)\.(\d+)\.(\d+)$/;
          const LOCKED = /agent-org\/tar\.gz\/([0-9a-f]{40})/;
          const versionOf = (name) => STABLE.exec(name)?.slice(1).map(Number) ?? null;
          const newer = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];

          /** The half-open interval a `^`, `~` or exact range spells, as [lower, upper) with a null upper meaning exact. */
          function interval(range) {
            const match = /^([\^~]?)(\d+)\.(\d+)\.(\d+)$/.exec(range);
            if (!match) return null;
            const [kind, major, minor, patch] = [match[1], ...match.slice(2).map(Number)];
            const lower = [major, minor, patch];
            if (kind === "") return { lower, upper: null };
            if (kind === "~") return { lower, upper: [major, minor + 1, 0] };
            if (major > 0) return { lower, upper: [major + 1, 0, 0] };
            return { lower, upper: minor > 0 ? [0, minor + 1, 0] : [0, 0, patch + 1] };
          }
          const inside = (v, { lower, upper }) =>
            upper ? newer(v, lower) >= 0 && newer(v, upper) < 0 : newer(v, lower) === 0;

          /** `name -> commit` from ls-remote lines; the peeled `^{}` line wins, because an annotated tag's own sha is not a commit. */
          function commitsByTag(text) {
            const commits = new Map();
            for (const line of text.split("\n")) {
              const [sha, ref] = line.trim().split(/\s+/);
              const name = ref?.replace(/^refs\/tags\//, "");
              if (!name || !/^[0-9a-f]{40}$/.test(sha)) continue;
              if (name.endsWith("^{}")) commits.set(name.slice(0, -3), sha);
              else if (!commits.has(name)) commits.set(name, sha);
            }
            return commits;
          }

          /** What to do, given the tags, the declared range and the commit the lockfile resolves. Absence is never "up to date". */
          function choose({ tagsText, range, lockedCommit }) {
            const window = interval(range ?? "");
            if (!window) return { action: "refuse", reason: `the range \`${range}\` is not one this workflow reads (^x.y.z, ~x.y.z or x.y.z)` };
            if (!lockedCommit) return { action: "refuse", reason: "the lockfile does not name a commit for agent-org, so \"already current\" cannot be told" };
            const commits = commitsByTag(tagsText);
            const stable = [...commits.keys()].filter((name) => versionOf(name)).sort((a, b) => newer(versionOf(a), versionOf(b)));
            if (!stable.length) return { action: "refuse", reason: "no release tag of the form vX.Y.Z could be read from agent-org" };
            const candidates = stable.filter((name) => inside(versionOf(name), window));
            const newest = stable.at(-1);
            if (!candidates.length) {
              return { action: "refuse", reason: `the newest release ${newest} is outside the declared range ${range}, and no release inside it exists. Moving the range is a deliberate row (#3244), not this workflow's` };
            }
            const tag = candidates.at(-1);
            const commit = commits.get(tag);
            const warning = newest !== tag ? `${newest} is newer than the range ${range} allows; moving the range is a deliberate row (#3244)` : null;
            if (commit === lockedCommit) return { action: "none", tag, commit, warning };
            const fromTag = stable.find((name) => commits.get(name) === lockedCommit);
            return { action: "bump", tag, commit, from: fromTag ?? lockedCommit.slice(0, 7), warning };
          }

          const declared = (manifest) => ["dependencies", "devDependencies", "optionalDependencies"].map((section) => manifest[section]?.["agent-org"]).find(Boolean);
          const rangeOf = (manifest) => /#semver:(.+)$/.exec(declared(JSON.parse(manifest)) ?? "")?.[1];
          const verdict = choose({
            tagsText: readFileSync(process.env.TAGS_FILE, "utf8"),
            range: rangeOf(readFileSync(process.env.PACKAGE_JSON, "utf8")),
            lockedCommit: LOCKED.exec(readFileSync(process.env.LOCKFILE, "utf8"))?.[1],
          });
          const lines = { refuse: `REFUSED: ${verdict.reason}`, none: `nothing to do: the lockfile already resolves ${verdict.tag} (${verdict.commit})`,
            bump: `bump agent-org from ${verdict.from} to ${verdict.tag} (${verdict.commit})` };
          console.log(lines[verdict.action]);
          if (verdict.warning) console.log(`::warning::${verdict.warning}`);
          const out = [`action=${verdict.action}`, `tag=${verdict.tag ?? ""}`, `commit=${verdict.commit ?? ""}`, `from=${verdict.from ?? ""}`];
          appendFileSync(process.env.GITHUB_OUTPUT, `${out.join("\n")}\n`);
          if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, `agent-org-bump: ${lines[verdict.action]}\n`);
          if (verdict.action === "refuse") {
            console.log(`::error::${verdict.reason}`);
            process.exitCode = 1;
          }
          JS
      # The whole move is the lockfile. `package.json` must come out byte-identical (the range is a deliberate row), and the
      # entry must land on the commit chosen above: a resolver that picked another is refused rather than described.
      - name: Move the pin in the lockfile only
        if: steps.choose.outputs.action == 'bump'
        env:
          COMMIT: ${{ steps.choose.outputs.commit }}
        run: |
          set -euo pipefail
          pnpm update agent-org --lockfile-only --ignore-scripts
          changed="$(git status --porcelain --untracked-files=all | cut -c4-)"
          if [ "$changed" != "pnpm-lock.yaml" ]; then
            echo "::error::the move changed [$changed], and it may change pnpm-lock.yaml alone (the package.json range is a deliberate row)"
            exit 1
          fi
          resolved="$(grep -m1 -oE 'agent-org/tar\.gz/[0-9a-f]{40}' pnpm-lock.yaml | cut -d/ -f3)"
          if [ "$resolved" != "$COMMIT" ]; then
            echo "::error::pnpm resolved agent-org to ${resolved:-nothing}, not the chosen $COMMIT"
            exit 1
          fi
      - name: Open the pull request, or bring the open one up to date
        if: steps.choose.outputs.action == 'bump'
        env:
          GH_TOKEN: ${{ secrets.A11IGN_BOT_TOKEN }}
          TAG: ${{ steps.choose.outputs.tag }}
          COMMIT: ${{ steps.choose.outputs.commit }}
          FROM: ${{ steps.choose.outputs.from }}
        run: |
          set -euo pipefail
          title="deps: bump agent-org from $FROM to $TAG"
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$(git ls-remote --heads origin "$BRANCH")" ]; then
            git fetch --depth=1 origin "$BRANCH"
            on_branch="$(git show FETCH_HEAD:pnpm-lock.yaml | grep -m1 -oE 'agent-org/tar\.gz/[0-9a-f]{40}' | cut -d/ -f3)"
            if [ -n "$number" ] && [ "$on_branch" = "$COMMIT" ]; then
              echo "pull request #$number is already at $TAG: nothing to push and nothing to edit"
              exit 0
            fi
          fi
          git switch -C "$BRANCH"
          git add pnpm-lock.yaml
          git -c user.name=a11ign-ci -c user.email=a11ign-ci@users.noreply.github.com commit -m "$title"
          git push --force origin "$BRANCH"
          cat > "$RUNNER_TEMP/body.md" <<BODY
          ## What it is

          The pin of agent-org follows its releases: this moves the lockfile entry from $FROM to $TAG ($COMMIT).
          The package.json range is unchanged, and the lockfile is the only file in the diff. Opened and kept current by
          agent-org-bump.yml, which approves nothing and merges nothing: the review main requires still applies.

          Acceptance:
          pnpm exec rstest run --config=scripts/rstest/rstest.config.mjs --include packages/lab/src/packaging/one-package-manager.test.ts

          Closes: none — a dependency pull request finishes no row (#3450)
          BODY
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
