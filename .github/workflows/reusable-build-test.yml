name: reusable-build-test

# A1 (#452): ONE definition of "build, lint, typecheck, test" shared by TWO callers that used to carry two
# independent, hand-maintained copies of the same steps -- `ci.yml`'s `ts`/`python` jobs and
# `trunk.yml`'s `trunkGate`. Chairman's own comment on `ci.yml` already measured the two running
# "the SAME suite, on every merge, close enough in wall time" -- the fact-stated-twice shape this repo's
# own rule says to end by deletion or derivation, never by a third reader trusting the two stay equal.
#
# `workflow_call` ONLY -- this file has no `on: push`/`on: pull_request` of its own, so it cannot appear on
# push-trigger-allowlist.test.ts's radar as a push-triggered file; it only ever runs when a caller invokes
# it, and the caller's own trigger is what that guard examines.
#
# THREE INDEPENDENT AXES, because the two real callers are NOT step-identical -- verified against
# `origin/main` before writing this, not assumed:
#
#   ci.yml's `ts` job:        build, docs:coverage, lint, typecheck, whole-suite tests -- no python
#   ci.yml's `python` job:    build only (a prerequisite for a python test that shells to node) -- no lint/
#                             typecheck/ts-tests, no docs:coverage
#   trunk-guard's `trunkGate`: build, lint, typecheck, whole-suite tests, python -- no docs:coverage
#
# (#2298: these three once differed by a fourth axis, a dedicated `node_modules` cache only the `ts` job
# carried. pnpm's STORE is what is cached now, by setup-node for every caller alike, so the axis is gone.)
#
# So parameterizing on the test step ALONE would either give trunk-guard `docs:coverage` it never had (new work
# on every merge to `main`) or silently drop it from `ci.yml` (a check deleted without anyone deciding to).
# Each input's default below is chosen to match the ORIGINAL, narrowest caller (`python`'s job),
# so a caller must opt IN to the extra work rather than opt out of it -- the same "additive, not a silent
# widening" instinct as `permissions:` below.
on:
  workflow_call:
    inputs:
      run-lint-typecheck:
        description: "Run pnpm run lint and pnpm run typecheck. On for ci.yml's ts and trunk's trunkGate; off for ci.yml's python (which never ran either)."
        type: boolean
        default: false
      run-docs-coverage:
        description: "Run pnpm run docs:coverage before lint/typecheck, so doc-references.test.ts sees the generated file. ONLY ci.yml's ts job had this -- neither python nor trunkGate ever ran it."
        type: boolean
        default: false
      run-ts-tests:
        description: "Run the TypeScript unit suite at all. Off for ci.yml's python job, which never ran any TS tests of its own."
        type: boolean
        default: false
      run-python-tests:
        description: "Run the Python setup + pytest suite. On for ci.yml's python job and trunk's trunkGate; off for ci.yml's ts job, which never touched Python."
        type: boolean
        default: false

# READ-ONLY, EXPLICITLY -- a `workflow_call` file that omits `permissions` inherits the CALLER's, which
# would be a widening invisible in this file's own diff. Nothing here writes anything: build, lint,
# typecheck and the test suites only read the checked-out tree and (for a handful of packaging tests that
# shell out to `gh issue list`/`gh pr view`) this repo's own Issues/PRs, using the ambient `github.token`
# that every job already carries -- no `secrets:` block needed to reach it.
permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # FULL HISTORY, FOR EVERY CALLER (#901, 2026-09-10). The revert-guard acceptance tests (#895) clone this checkout with
      # `--local`, and a clone of a shallow checkout is shallow: `fc9b89d2` and `f2cdfaf3` (the two real merges the guard is proved
      # against) are not in it, and the guard exits CANNOT_ASK. trunk-guard's `trunkBuildTest` took the shallow step once, and main
      # read red on every push from 48aef3f2 (2026-09-09 19:11Z) for 27 hours, each later push declined as INHERITED. Full history
      # costs one ~30 MiB pack fetch per run, which is cheaper than a test suite that cannot run its own acceptance.
      - name: Checkout (full history -- the revert-guard acceptance needs the real merges)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      # #2298: NO DEDICATED `node_modules` CACHE. `ts` used to restore `node_modules` itself, keyed on the npm
      # lockfile, and skip the install on a hit. What is cached now is pnpm's STORE (setup-node's `cache: pnpm`,
      # keyed on pnpm-lock.yaml, for every caller), and the install always runs: it links from the store, so a
      # warm run pays for linking rather than for downloads. A restored `node_modules` keyed on the OLD lockfile
      # would never have invalidated when pnpm-lock.yaml changed.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: The tool at the newest release tag, cloned for this run, with `agent-org` on PATH (#3534)
        run: node scripts/agent-org-newest-tag.mjs --dest="$RUNNER_TEMP/agent-org"
      - run: pnpm run build
      # #168: WHAT THE BUILD ACTUALLY PRODUCED, kept only when something after it fails. See the ORIGINAL
      # comment in ci.yml's history for the full incident (an intermittent cross-package dist race) --
      # kept here verbatim in spirit: cheap on a green run, and the thing that would tell a future reader
      # plainly if a build-order race reappears through some other door.
      - name: "#168: what the build produced, if anything below fails"
        if: failure()
        run: |
          echo "--- packages/evidence/dist ---"
          ls -la packages/evidence/dist/ || echo "(no dist directory at all)"
          echo "--- wcag.d.ts, first 20 lines ---"
          head -20 packages/evidence/dist/wcag.d.ts || echo "(no wcag.d.ts)"
          echo "--- does tsc consider the graph up to date? ---"
          pnpm exec tsc --build --dry $(node -e "const fs=require('fs');console.log(fs.readdirSync('packages').filter(d=>fs.existsSync('packages/'+d+'/tsconfig.json')).map(d=>'packages/'+d).join(' '))") || true
      # docs/coverage.md is GENERATED and DELIBERATELY UNTRACKED (#158) -- a fresh checkout has no copy, so
      # doc-references.test.ts (reached by the suite) would otherwise report a real
      # citation as broken. Only the
      # original `ts` job ever paid for this; kept opt-in so trunkGate does not gain a step it never had.
      - if: inputs.run-docs-coverage
        run: pnpm run docs:coverage
      - if: inputs.run-lint-typecheck
        run: pnpm run lint
      - if: inputs.run-lint-typecheck
        run: pnpm run typecheck
      # #1319: RSTEST'S BUILD CACHE, PERSISTED -- the chairman's requirement for the runner switch, per rstest's CI guide.
      # `scripts/rstest/rstest.config.mjs` turns `performance.buildCache` on only when `CI` is set, and rstest writes it
      # under node_modules/.cache/rstest-<project-name>. Keyed on the two inputs the row names, the lockfile and the rstest
      # config; rstest's own invalidation handles a changed source file inside a hit. HIT or MISS is printed so a run
      # log can be quoted, and the step after the tests fails the job if the cache is empty.
      - if: inputs.run-ts-tests
        uses: actions/cache@v6
        id: rstest-build-cache
        with:
          path: node_modules/.cache/rstest-*
          key: rstest-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/rstest/rstest.config.mjs') }}
      - name: "#1319: rstest build cache HIT or MISS, printed so the run log can be quoted"
        if: inputs.run-ts-tests
        run: |
          echo "rstest build cache: ${{ steps.rstest-build-cache.outputs.cache-hit == 'true' && 'HIT' || 'MISS' }}"
          files=$( (find node_modules/.cache -path 'node_modules/.cache/rstest-*' -type f 2>/dev/null || true) | wc -l)
          echo "files under node_modules/.cache/rstest-* before the tests: $files"
      # THE WHOLE SUITE, for every caller (#3573, chairman via ceo, 2026-10-04): the PR `ts` job used to run a hand-built
      # selection of test files and trunk-guard ran everything; one answer now, because `rstest run --changed` is the only
      # selector left and it runs locally, in `verify`. Never a per-package slice: every merge needs the full answer regardless
      # of what its own diff touched.
      - name: Unit tests
        if: inputs.run-ts-tests
        env:
          GH_TOKEN: ${{ github.token }}
        # #1319: the script passes `--runner=rstest` to the floor, so this step runs rstest over the glob.
        # `test:all`, NOT `test:ts`: since the package split `test:ts` is the PRODUCT suite (206 files) and
        # the org's 373 tests live in agent-org/guards/lab. "Unscoped" means every merge to main gets the
        # full answer, so it must be the glob that covers every package -- `test:ts` here would drop two
        # thirds of the suite and still read green, which is the exact shape this job exists to prevent.
        run: pnpm run test:all
      # #1319: A CACHE THAT IS NEVER WRITTEN RESTORES NOTHING AND STILL READS GREEN. rstest ran above with its build cache
      # on, since CI is set, so the cache directory must now hold files. An empty one fails the job rather than leaving
      # the HIT or MISS line to describe a cache that does not exist. No workflow expressions, so
      # runner-is-rstest.test.ts executes this exact script against an empty and a filled directory.
      - name: "#1319: rstest build cache must hold files after the tests"
        if: inputs.run-ts-tests
        run: |
          files=$( (find node_modules/.cache -path 'node_modules/.cache/rstest-*' -type f 2>/dev/null || true) | wc -l)
          echo "files under node_modules/.cache/rstest-* after the tests: $files"
          if [ "$files" -eq 0 ]; then
            echo "rstest ran with performance.buildCache on and wrote no cache files -- the cache step above would save"
            echo "an empty directory, and every later run would read MISS while looking configured."
            exit 1
          fi
      - if: inputs.run-python-tests
        uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - if: inputs.run-python-tests
        run: pip install -r requirements-ci.txt
      # Same two flags as the root `test:python` script and both original callers, deliberately:
      # `spec_from_file_location` honours `__pycache__`, and a stale compile has decided a mutation check
      # wrongly in this repo before.
      - if: inputs.run-python-tests
        run: PYTHONDONTWRITEBYTECODE=1 pytest -p no:cacheprovider packages/*/tests -q
