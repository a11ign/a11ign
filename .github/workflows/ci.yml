name: ci

# ONE workflow for a PR, replacing three that used to run independently on the same commit:
#
#   - `lint.yml` had NO path filter at all and ran lint, typecheck, the full TS suite and the full Python
#     suite on a one-line docs edit exactly as it did on a capture-path rewrite -- on BOTH `push` and
#     `pull_request`, so every PR commit ran the whole thing twice.
#   - `changeset-check.yml` re-derived "does this touch a published package" with its own inline `git diff`.
#   - `ansible-check.yml` carried a THIRD, independent "did the fleet's Ansible layer change" `paths:` block.
#
# Three copies of "what changed", proven capable of drifting the moment a fourth question (docs) needed
# asking too -- this repo's own most-repeated defect, aimed at its own CI. `scripts/ci-changed.ts` is now
# the one place that question is answered, and every job below is conditional on its output rather than
# carrying its own `paths:` filter. `ci-changed.test.ts` pins the classification AND this file's own
# trigger table, so a future "just add the tests to lint" (or the equivalent here) fails a unit test rather
# than the PR budget.
#
# NO PUSH TRIGGER, EVER -- chairman's direction, 2026-09-06, correcting this file's own first version. The
# flow is PR then merge, and every check that gates code must run before the merge: a check that runs AFTER
# it cannot stop it, which is exactly what a `push: branches: [main]` trigger was -- a gate with the barn
# door already open. `pull_request` and `merge_group` (#156) are both PRE-merge events; branch protection
# (requiring these checks green AND the branch up to date with `main`) is what makes the commit that was
# tested the commit that lands, via a squash/fast-forward merge or a merge-queue merge, never a merge
# commit CI never saw.
#
# #156's OTHER HALF IS A SETTINGS CHANGE, NOT MADE HERE: branch protection on `main` must require `gate`
# alone, not the five scoped jobs directly (see the `gate` job's own comment below for why), or a
# merge-group run gets asked for six path-scoped contexts against a ref that most of them correctly skip --
# multiplying the "a required check with no run blocks merge forever" exposure `gate` exists to remove. And
# enabling the merge queue itself (a ruleset) is `ceo`'s to authorise, not a code change at all.
#
# THE `ts` JOB NO LONGER CARRIES ISOLATION, AND ITS TESTS NOW RUN THE WHOLE SUITE (below) -- chairman's
# follow-up, 2026-09-06, measuring `ci/ts` at 269s on a one-package PR (unit tests 84s, then a 154s step
# running coverage/rules-check/scorer:verify/gate:isolation over the ENTIRE repository regardless of what
# the PR actually touched). Budget dropped from four minutes to sixty seconds the same day. Three changes:
#
#   - `gate:isolation` (every package's tarball is installable) left the PR job entirely -- see `release.yml`
#     (via `release:gate:ci`, already there). It does not answer "did THIS PR's diff regress"; it answers "is
#     the repository as a whole still sound", which does not need re-asking on every commit of every PR.
#   - COVERAGE CAME BACK, AS THE UNIT-TEST STEP ITSELF (#3999, chairman via ceo, 2026-10-07): the whole suite runs
#     every time since #3573, so the second full run that was the 154 s is gone and `.c8rc.json`'s whole-repo
#     floor is measured IN the one run (`run-coverage` in `reusable-build-test.yml`). The release path no longer
#     re-runs it; `nightly.yml`'s `coverage` job stays, for a regression a package-scoped run could not see.
#   - The rules fitness gate (`pnpm run rules-check`) is now its own job below, `rulesFitness`, gated on
#     `packages/judge` or `packages/evidence` having changed -- the only two paths that can move its
#     answer, per `ci-changed.ts`'s `rulesFitness` category.
#
# Unit tests run the WHOLE suite (#3573, chairman via ceo, 2026-10-04). They used to run over `testPackages` (touched packages
# plus every workspace dependent) and then a hand-built selection of test files, to keep a one-package PR near a 60s budget
# (#212 measured ~90s on a leaf `packages/lab` PR and accepted it). The selection is deleted: `rstest run --changed` is the one
# selector left, runs locally in `pnpm run verify`, and a PR's own CI run answers the whole-suite question. What a PR now pays in wall
# time is measured on the row (#3573), not argued here.
#
# AGENT/** AND LEAD/** BRANCH PUSHES DO NOT TRIGGER THIS WORKFLOW EITHER, same as before -- every unit ends
# with `gh pr create` (the standing worker-loop flow), so the PR's own `pull_request` trigger is where a
# branch's full check runs; a push with no PR yet gets only the local pre-push hook's fast gate. See
# `scripts/git-hooks/pre-push`'s own header for the other half of this.
#
# THE `gate` JOB AT THE BOTTOM IS WHAT BRANCH PROTECTION ACTUALLY REQUIRES, not the five scoped jobs
# above it. Every job but `changed` is conditional on `ci-changed.ts`'s output, so a docs-only PR never
# runs `ts`/`python`/`ansible` at all -- and a required check with no run against a given commit blocks
# merge FOREVER, it does not pass by default. GitHub does treat a job SKIPPED by its own `if:` as
# satisfying a required check (a real run, concluding `skipped`, distinct from never running) -- #133
# required all five path-scoped contexts directly and it merged fine on that behaviour. But relying on an
# implicit platform behaviour for the one thing that gates every merge is exactly this repo's own rule
# about a verification not sharing a failure mode with what it guards: `gate` computes the same answer
# explicitly, from `needs.*.result`, so branch protection has ONE always-reporting context to require and
# the real logic lives in a file this repo tests, not in an assumption about how GitHub renders a skip.
on:
  pull_request:
    branches: [main]
    # `edited` IS LOAD-BEARING, and its absence deadlocked the queue for eight hours -- 2026-09-07.
    #
    # GitHub's default `pull_request` types are `opened, synchronize, reopened`. Unit 2's `acceptance` job
    # (#353) reads the PR BODY, so a PR whose only defect is its body -- a prose `Acceptance:` line that
    # bash cannot run, or no line at all -- can be fixed only by editing the body, and NO DEFAULT TRIGGER
    # FIRES ON THAT. Measured: zero merges between 13:38Z and 21:10Z, every `ci.yml` run red on
    # `acceptance`, five open PRs written before the field existed and two whose corrected bodies could
    # not be re-read. The gate was right and there was no way to satisfy it.
    #
    # A job that reads an input no trigger watches cannot be fixed by the person holding the input. That
    # is the general shape, and it costs a whole queue rather than one PR.
    #
    # The cost of the fix WAS a full `ci.yml` run per title or body edit, and this paragraph said the heavy jobs
    # skip because `changed` diffs against the base and a body edit changes no files. THAT WAS NEVER TRUE: the
    # diff is the whole pull request, so `ts` and `guardSweep` ran in full on every body edit and
    # every label (#3211, three runs of one head: 141 s, 33 s and 146 s of jobs each time). The heavy jobs now
    # exclude these three types BY NAME, and the `concurrency` block below keeps them from cancelling a test run.
    # `labeled`/`unlabeled` ARE THE HALF THAT MAKES THE HOLD REAL. `gate` refuses a PR carrying a
    # `hold:<session>` label (2026-09-09), and a hold is placed by adding a label -- which changes no file
    # and moves no commit. Without these two types, a hold placed on a GREEN PR never re-runs the check
    # that would refuse it, and GitHub's auto-merge takes it: the change would protect only PRs that
    # happen to be pushed to afterwards, which is not the population a hold is for.
    #
    # This is `edited`'s own lesson, one field along. A job reading an input no trigger watches cannot be
    # fixed by the person holding the input -- there, a PR body; here, a label.
    #
    # What re-runs for a label is `changed`, `deliberateRefusals` (it reads the label and the body),
    # `acceptance`, `ownedPaths` and `gate`.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  # #156: a merge queue CANNOT be turned on without this. GitHub's own docs are explicit -- "You must use
  # the merge_group event to trigger your GitHub Actions workflow when a pull request is added to a merge
  # queue ... Otherwise, status checks will not be triggered" -- and an entry whose checks never report is
  # removed for timing out, silently, with no error anywhere. `ci-changed.test.ts` pins that this key stays
  # ALONGSIDE `pull_request`, never in place of it: the PR itself still needs its own run before it can be
  # queued at all.
  merge_group:
    branches: [main]

# #3211: A BODY EDIT OR A LABEL IS A `meta` EVENT, AND IT MUST NOT CANCEL A TEST RUN. The chairman's sample (278
# pull-request runs since 2026-10-01; #3212 reconciles it with a larger count): 158 were on a head SHA that had already
# been tested, and 134 of those were cancelled -- one group per ref meant a label added while `ts` was running cancelled `ts`, and the run that replaced it
# started the whole suite again. So the group is keyed by the KIND of event: a code event (`opened`, `synchronize`,
# `reopened`, and `merge_group`) cancels the previous code run on the ref, which is what `cancel-in-progress` is for; a
# meta event (`edited`, `labeled`, `unlabeled`) cancels only the previous meta run. They never share a group.
#
# THE SPLIT IS SAFE BECAUSE `gate` DOES NOT LET EITHER KIND REPORT GREEN ON ITS OWN -- see its last step. Without that,
# a meta run would report `gate` green with every heavy job SKIPPED, on a head whose tests have not finished.
run-name: ${{ contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) && format('{0} [meta event, {1}]', github.event.pull_request.title, github.event.action) || '' }}

concurrency:
  group: ci-${{ github.ref }}-${{ contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) && 'meta' || 'code' }}
  cancel-in-progress: true

jobs:
  # #4413: IS THIS A PR-BODY EDIT THAT TOUCHED NOTHING A CHECK READS? A description edit is a `meta` event, and the checks that read
  # the body (`acceptance`, `ownedPaths`, the Closes comparison) cannot change their answer on prose, so they are skipped for it and
  # the person who fixed a typo is not handed a red pull request. It runs on EVERY event and always succeeds with an answer, because
  # a job whose `needs` was skipped is skipped itself, and `false` is the answer for everything that is not provably prose.
  #
  # "PROSE" IS DEFINED BY WHAT IT IS NOT, since the body's real parser lives in the tool and not in this repository, and a second copy
  # of it here would drift from the first. The GUARDED lines are: anything inside a code fence, a heading and the section under
  # one named for a thing the checks read, any `Field:` line (`Acceptance:`, `Class:`, `History:`, `Hand-run:`, `New-file:`...), and
  # any line saying close / fix / resolve (the Closes declaration, and GitHub's own closing keywords). The edit is prose-only iff the
  # guarded lines are byte-identical before and after. The error runs toward re-running: a prose line that looks like a field is
  # checked again, and a body edit that FIXES the check is never read as prose (the 2026-09-07 deadlock, from the other side).
  #
  # THREE MORE REFUSALS, each a way a skip would hide something:
  #   * `changes.base` -- a retarget moves the diff `ownedPaths` reads, with no body change at all.
  #   * AN UNSETTLED PREVIOUS META RUN. The group cancels the previous meta run, so edit A (Acceptance fixed) cancelled by edit B
  #     (prose) would leave A's change checked by nobody. B is full when the run before it was cancelled or is still going.
  #   * A FAILED READ of that run list. Not knowing is not prose.
  # `deliberateRefusals` is NOT skipped for prose: its `merge-guard --ci-gate` is where a `hold:` label is enforced, and a prose edit
  # landing after a hold would otherwise report green over the red that the label run left.
  bodyEdit:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      proseOnly: ${{ steps.classify.outputs.proseOnly }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE_CHANGED: ${{ github.event.changes.base != null && 'true' || 'false' }}
          BODY_CHANGED: ${{ github.event.changes.body != null && 'true' || 'false' }}
          BODY_BEFORE: ${{ github.event.changes.body.from }}
          BODY_AFTER: ${{ github.event.pull_request.body }}
        run: |
          # stdin: a PR body. Prints the lines a check reads, and nothing else (see the job's comment for what that means).
          guarded_lines() {
            tr -d '\r' | awk '
              /^[ \t]*```/ { fence = !fence; print; next }
              fence { print; next }
              /^[ \t]*#+[ \t]/ { section = (tolower($0) ~ /(acceptance|refutation|mutation|measured|hand-run|history|class|closes|sign-?off)/); print; next }
              section { print; next }
              /^[ \t]*(\*\*|__)?[A-Za-z][A-Za-z -]*:/ { print; next }
              tolower($0) ~ /(^|[^a-z])(close[sd]?|fix(e[sd])?|resolve[sd]?)([^a-z]|$)/ { print; next }'
          }
          # stdin: the listing of this workflow's runs on the head. `yes` if the meta run before this one did not settle as a verdict.
          previous_meta_run_unsettled() {
            jq -r --arg self "$GITHUB_RUN_ID" '
              ([.workflow_runs[] | select((.id | tostring) == $self) | .created_at] | first) as $mine
              | [.workflow_runs[]
                  | select((.id | tostring) != $self and ((.display_title // "") | test(" \\[meta event, [a-z]+\\]$")) and .created_at < $mine)]
              | sort_by(.created_at) | last
              | if . != null and (.status != "completed" or .conclusion == "cancelled") then "yes" else "no" end'
          }
          decide() {
            [ "$EVENT" = pull_request ] && [ "$ACTION" = edited ] || { echo "not a description edit"; return 1; }
            [ "$BASE_CHANGED" = false ] || { echo "the base branch changed"; return 1; }
            [ "$BODY_CHANGED" = true ] || { echo "the body did not change (a title edit)"; return 0; }
            [ "$(printf '%s' "$BODY_BEFORE" | guarded_lines)" = "$(printf '%s' "$BODY_AFTER" | guarded_lines)" ] \
              || { echo "the edit touched a line a check reads"; return 1; }
            runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100") \
              || { echo "could not read the run list, so cannot rule out an unchecked edit"; return 1; }
            [ "$(printf '%s' "$runs" | previous_meta_run_unsettled)" = no ] \
              || { echo "the meta run before this one was cancelled or is unsettled, so its edit may be unchecked"; return 1; }
            echo "prose only"
          }
          if reason=$(decide); then proseOnly=true; else proseOnly=false; fi
          echo "proseOnly=$proseOnly ($reason)"
          echo "proseOnly=$proseOnly" >> "$GITHUB_OUTPUT"

  # THE FIRST JOB, and everything else is conditional on it. Always runs -- cheap, no build, one git diff
  # -- so a skipped downstream job is a real decision rather than an artefact of this job itself having
  # been skipped.
  changed:
    # A CLOSED PR IS NOT A PR TO TEST. `edited` (above) fires on a title or body edit, and a body can be
    # edited after the merge -- #690 was, two minutes after landing, to record how a verification had been
    # run. CI then ran against a merged PR whose branch had been deleted, and two guards refused correctly
    # on a state they can never pass: `mergeSafety` could not read the branch tip (#294: INCONCLUSIVE, not
    # clear) and `ci-changed` found `git diff origin/main...HEAD` empty, because after the merge HEAD IS an
    # ancestor of main and the three-dot diff is diff(B,B) by construction.
    #
    # Neither guard is wrong. The run is. Permanent red on a merged head is noise in the section that
    # reports non-success checks on merged PRs -- the view the chairman reads -- and noise there trains
    # people to skip the section, which is how one real red sat unnoticed for ninety minutes.
    #
    # `edited` STAYS: the acceptance job reads `github.event.pull_request.body`, so a body edit must
    # re-run it while the PR is open. The state check narrows exactly the case that has no PR left to
    # gate. `merge_group` has no `pull_request` context at all, hence the event_name half.
    if: github.event_name != 'pull_request' || github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.classify.outputs.ts }}
      python: ${{ steps.classify.outputs.python }}
      ansible: ${{ steps.classify.outputs.ansible }}
      docs: ${{ steps.classify.outputs.docs }}
      board: ${{ steps.classify.outputs.board }}
      changeset: ${{ steps.classify.outputs.changeset }}
      rulesFitness: ${{ steps.classify.outputs.rulesFitness }}
      packages: ${{ steps.classify.outputs.packages }}
      # EXPOSED so `changeset` (below) does not re-derive it and risk the merge_group trap this step's own
      # comment names -- a second, independent `github.base_ref` read in a different job is exactly the
      # shape that drifted once already (#156).
      base: ${{ steps.base.outputs.ref }}
    steps:
      # FULL HISTORY. A shallow clone fails `git diff <base>...HEAD` with "no commits in common" --
      # `changeset-check.yml`'s own comment already named this trap.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      # `github.base_ref` is EMPTY on a merge_group event -- it exists only for pull_request. The base
      # there is `github.event.merge_group.base_ref`, and GitHub's own payload documents that as the FULL
      # ref (`refs/heads/main`), not the short name `pull_request` gives (`main`) -- two different shapes
      # for "the base branch", and treating them as the same string is exactly the trap #156 was filed
      # against. Verified rather than assumed: an unhandled empty `github.base_ref` does not hit
      # `ci-changed.ts`'s own named "diff returned nothing" refusal at all -- `git diff origin/...HEAD`
      # with nothing between the dots is a `fatal: ambiguous argument`, an uncaught crash with a git error
      # rather than this script's clear message. `${base#refs/heads/}` strips a leading `refs/heads/` if
      # present and is a no-op otherwise, so this is correct for both shapes regardless of which one
      # GitHub actually sends.
      - id: base
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            base="${{ github.event.merge_group.base_ref }}"
            base="${base#refs/heads/}"
          else
            base="${{ github.base_ref }}"
          fi
          echo "ref=origin/$base" >> "$GITHUB_OUTPUT"
      - id: classify
        run: node scripts/ci-changed.ts --event=${{ github.event_name }} --base=${{ steps.base.outputs.ref }}

  # A1 (#452): CALLS `reusable-build-test.yml` rather than carrying its own steps -- see that file's own
  # header for why (its `trunkGate` sibling in trunk.yml used to duplicate most of this job's steps
  # independently, and chairman's own comment here used to note the two ran "the SAME suite" -- now true
  # by construction, not by two authors keeping two copies equal).
  ts:
    needs: changed
    if: needs.changed.outputs.ts == 'true' && !contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action)
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      run-lint-typecheck: true
      run-docs-coverage: true
      run-ts-tests: true
      run-coverage: true

  # A1 (#452): CALLS `reusable-build-test.yml` for the one thing this job ever needed from it -- a real
  # `dist/`, since `@a11ign/screenreader-fleet/cli-flags` resolves through `package.json`'s `exports` map and a
  # handful of Python tests (`test_grants_map_is_current.py`, `test_unclosable_map_is_current.py`) shell
  # out to a `node` script that imports it. No lint, no typecheck, no TS tests, no docs:coverage --
  # this job never ran any of those, and the reusable file's defaults are
  # deliberately "off" for exactly this reason: opting IN to extra work, never opting OUT of it.
  python:
    needs: changed
    if: needs.changed.outputs.python == 'true' && !contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action)
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      run-python-tests: true

  ansible:
    needs: changed
    if: needs.changed.outputs.ansible == 'true' && !contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      # The playbooks left this repository for `a11ign/control` (#3506): they are LAID at the tag `layers.json` pins, which needs git and node and nothing installed.
      - name: Lay a11ign/control's playbooks where the checks read them
        run: node scripts/lay-layer.ts control
      # `ansible-core`, not the full `ansible` metapackage -- the metapackage bundles hundreds of
      # collections this fleet does not use.
      - run: pip install ansible-core pyyaml
      - name: Install the collections these playbooks import
        run: ansible-galaxy collection install -r packages/control/ansible/requirements.yml
      - name: Every playbook still parses
        env:
          ANSIBLE_CONFIG: packages/control/ansible/ansible.cfg
        run: |
          status=0
          for playbook in packages/control/ansible/*.yml; do
            # roles/, tasks/, group_vars/ and the two inventory files are not playbooks (no top-level
            # `hosts:`) and --syntax-check on one of those fails for a reason unrelated to this check.
            grep -q "^- hosts:\|^  hosts:" "$playbook" || continue
            echo "--- $playbook ---"
            ansible-playbook -i packages/control/ansible/inventory.example.yml --syntax-check "$playbook" || status=1
          done
          exit $status
      - name: Every module invocation matches what the module actually documents
        working-directory: packages/control/ansible
        run: python3 check-modules.py

  # #1065: the `docs` job that used to stand here (the whole packaging glob on a shallow checkout) is
  # DELETED. Since #902 it reported without deciding, it went red on an environment-only failure (#1064)
  # and a PR merged through it unread. Its population runs unscoped in trunk-guard on a full-history
  # checkout after every merge, which is the gate that acts; the kept guards run in `ts` on every PR.

  board:
    needs: changed
    if: needs.changed.outputs.board == 'true' && !contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action)
    uses: ./.github/workflows/reusable-board.yml

  # THE RULES FITNESS GATE, ITS OWN JOB -- chairman's direction, 2026-09-06. Used to run inside `ts`
  # unconditionally on every package change; now gated on `rulesFitness`, true only when
  # `packages/judge` or `packages/evidence` changed, the only two paths that can move its answer.
  rulesFitness:
    needs: changed
    if: needs.changed.outputs.rulesFitness == 'true' && !contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: The tool at the newest release tag, cloned for this run, with `agent-org` on PATH (#3534)
        run: node scripts/agent-org-newest-tag.ts --dest="$RUNNER_TEMP/agent-org"
      - run: pnpm run build
      - run: pnpm run rules-check

  # THE CROSS-REPOSITORY REACH REPORT, NON-BLOCKING (epic #4425 phase 2, #4434). `boundary-check` (`@a11ign/toolchain`, #4432) lists the
  # places this tree reaches into another repository's source, against `packages/guards/layer-edges.baseline.json`: the crossings
  # ACCEPTED as they stand (the epic's item 7: baselined, not removed), the NEW ones a pull request adds, and the STALE baseline lines
  # that no longer match anything (delete them: the baseline only shrinks). It is a report, never a red: `continue-on-error` here, and
  # the job is deliberately NOT in `gate`'s `needs` (`boundary-report-job.test.ts` refuses it there), so it can never hold a merge.
  # The toolchain release is read from `package.json`'s `config.boundaryCheckToolchain` (0.4.0 is the first carrying the bin). It is NOT the
  # `@a11ign/toolchain` devDependency: `toolchain-package.test.ts` pins that to one version across the root, cli, judge and scorer, and they build
  # with the presets at 0.1.4. Moving all four is its own row.
  boundary:
    if: ${{ !contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: boundary-check against the committed baseline
        run: |
          version="$(node -p "require('./package.json').config.boundaryCheckToolchain")"
          npx --yes --package "@a11ign/toolchain@${version}" boundary-check --root=. --baseline=packages/guards/layer-edges.baseline.json --out=boundary-report.json
      - name: The accepted, new and stale counts, in the job summary
        if: always()
        run: |
          if [ ! -f boundary-report.json ]; then
            echo "## Boundary report (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
            echo "boundary-check wrote no report; see the step log. Nothing about this pull request is implied." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Boundary report (non-blocking)"
            echo "- accepted: $(jq '[.crossings[] | select(.status == "accepted")] | length' boundary-report.json)"
            echo "- new: $(jq '[.crossings[] | select(.status != "accepted")] | length' boundary-report.json)"
            echo "- stale baseline lines: $(jq '.stale | length' boundary-report.json)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: boundary-report
          path: boundary-report.json
          if-no-files-found: warn

  changeset:
    needs: changed
    # `needs.changed.outputs.changeset` here is a cheap OVER-APPROXIMATION -- `changed` has no install
    # and so cannot safely call `npm pack`, so its `classify()` run answers "does this PR touch a
    # published package's directory at all", the same blunt shape `changeset-check.yml`'s old regex used
    # before #132. A false positive here costs one job run that then finds nothing to enforce (below); a
    # false negative would skip the real check entirely, which is why the cheap answer only ever widens.
    if: needs.changed.outputs.changeset == 'true' && !contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action)
    runs-on: ubuntu-latest
    # `pull-requests: read` for the `noRelease` step below, which reads the live body.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: The tool at the newest release tag, cloned for this run, with `agent-org` on PATH (#3534)
        run: node scripts/agent-org-newest-tag.ts --dest="$RUNNER_TEMP/agent-org"
      # PRECISE, now that the install has made `npm pack` safe to call. `orchestrator` reproduced the crash
      # this avoids: `classify()` calling the real `packedFiles` inside `changed` (no install at all) fails
      # on every PR touching a published package. This re-derives the real answer -- does npm actually
      # SHIP this file -- and it is what decides whether the enforcement step below runs anything at all.
      - id: precise
        run: node scripts/ci-changed.ts --event=${{ github.event_name }} --base=${{ needs.changed.outputs.base }} --precise
      # #3159 (sibling of #3137, ADR 0041 decision 4): A DEPENDENCY PULL REQUEST IS READ FROM ITS DIFF. This job runs
      # `changeset status`, which reads files, so #3137's body fragment cannot clear it (#3155 failed here). The entry a
      # consumer reads is DERIVED from the manifests, never typed and never taken from the title, and it is written when
      # the version is made (`dependency-changeset.ts compile`), so nothing is pushed to Dependabot's branch. A bump
      # of a published package's runtime range is accepted as a `patch`; a diff that moves only devDependencies is
      # accepted as empty; a major, a 0.x minor, an owned path or anything outside the manifests is REFUSED here, and
      # the log names which, so that pull request waits for a human who looks. Recognised by the `deps:` prefix
      # `dependabot.yml` pins, on the pull request AND on its queue entry (the merge group has no title), or the queue
      # would eject what this job passed; and the entry is diffed against its own parent
      # (`merge_group.base_sha`, empty on a pull request), because up to 5 are built and entry 2 contains entry 1. Every other pull request keeps the step below.
      # The title is read by an expression, never interpolated into a shell line.
      #
      # #3220: THE QUEUE ENTRY'S MESSAGE IS A MERGE COMMIT'S, NOT A SQUASH'S. The `merge-queue-main` ruleset (23681721) has
      # `merge_method: MERGE` (`gh api repos/a11ign/a11ign/rulesets/23681721`), so `head_commit.message` is `Merge pull
      # request #N from <owner>/<branch>`, a blank line, then the title: `startsWith(..., 'deps:')` was false on it, the
      # derivation was skipped, the generic `changeset status --since` ran and exited 1, and #3155's entry was ejected twice
      # (run 37120613262). The step below reads the TITLE LINE (the third) in shell, since a newline cannot be written inside
      # an expression string, and it is the same prefix the pull request was passed on, so the queue never judges a pull
      # request by something other than what the pull request was judged by. A switch to SQUASH changes the message and
      # is the moment this step changes (the `version` step below says the same).
      - id: dependencyQueue
        name: A dependency pull request's queue entry is recognised by the title on its merge commit
        if: github.event_name == 'merge_group'
        env:
          QUEUE_MESSAGE: ${{ github.event.merge_group.head_commit.message }}
        run: |
          first=$(printf '%s\n' "$QUEUE_MESSAGE" | sed -n 1p)
          title=$(printf '%s\n' "$QUEUE_MESSAGE" | sed -n 3p)
          if [[ "$first" =~ ^Merge\ pull\ request\ \#[0-9]+\ from\  && "$title" == deps:* ]]; then
            echo "queue=true" >> "$GITHUB_OUTPUT"
          fi
      - id: dependency
        name: A dependency pull request owes the entry its diff derives
        if: steps.precise.outputs.changeset == 'true' && (startsWith(github.event.pull_request.title, 'deps:') || steps.dependencyQueue.outputs.queue == 'true')
        run: |
          node --import tsx scripts/dependency-changeset.ts check --base=${{ needs.changed.outputs.base }} --since=${{ github.event.merge_group.base_sha }}
          echo "settled=true" >> "$GITHUB_OUTPUT"
      # #4136: `no-release: <reason>` IN THE BODY SETTLES A REFUSAL HERE AS IT DOES IN THE SHARED CHECK (a11ign/toolchain
      # `changeset-required.yml`, #4127), because two vocabularies are two rules: this job's `npm pack` answer decides WHICH pull
      # requests owe a changeset, and the line says why one that does owes none. `scripts/ci-changed.ts --no-release` is the parser
      # (the shared script's, case for case). THE BODY IS READ LIVE, never from the event payload: that copy is stale on a rerun, which is
      # how a body corrected after the refusal clears it (edit the body, then rerun this run's failed jobs; a `meta` run skips this job).
      # A queue entry has no body, so the pull request it carries is found by the number on its merge commit's first line, as the title is
      # above, and judged by the same body the pull request was: the queue never decides by something the pull request was not.
      - id: noRelease
        name: "A body line `no-release: <reason>` says nothing should ship"
        if: steps.precise.outputs.changeset == 'true' && steps.dependency.outputs.settled != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
          QUEUE_MESSAGE: ${{ github.event.merge_group.head_commit.message }}
        run: |
          number="${PULL_NUMBER:-$(printf '%s\n' "$QUEUE_MESSAGE" | sed -nE '1s/^Merge pull request #([0-9]+) from .*/\1/p')}"
          if [ -z "$number" ]; then echo "no pull request number to read a body from: the changeset check decides"; exit 0; fi
          PR_BODY=$(gh api "repos/$REPO/pulls/$number" --jq '.body // ""') node scripts/ci-changed.ts --no-release
      # #3584: A QUEUE ENTRY IS DIFFED AGAINST ITS OWN PARENT, as the `deps:` step above does. Up to 5 entries are built and
      # entry 2 contains entry 1, while `needs.changed.outputs.base` is `origin/main`, which does not yet hold the entry
      # ahead: behind the version-packages entry, its consumed bumps of `package.json` and `CHANGELOG.md` read as this
      # entry's own, and `changeset status` ejected #3579 (run 37241009696). `merge_group.base_sha` is EMPTY on a pull
      # request, so `||` falls through to the base it has always used there.
      - name: A consumer-visible change must say what it does to a consumer
        if: steps.precise.outputs.changeset == 'true' && steps.dependency.outputs.settled != 'true' && steps.noRelease.outputs.settled != 'true'
        run: |
          if ! pnpm exec changeset status --since=${{ github.event.merge_group.base_sha || needs.changed.outputs.base }}; then
            echo "::error::This PR changes a published package and carries no changeset."
            echo "Run 'pnpm run changeset', pick the packages and bump levels, and write one sentence a"
            echo "CONSUMER would want to read. See .changeset/README.md -- the bump level does NOT follow"
            echo "from the size of the diff, and for the scorer any retrain is a MAJOR."
            echo "If the change genuinely cannot affect a consumer, 'pnpm exec changeset add --empty' records"
            echo "that decision explicitly rather than leaving it to be inferred from silence."
            echo "If nothing here should ship, say why in the pull request body on a line 'no-release: <reason>', then rerun this job."
            exit 1
          fi

  # #2348: THE TREE-WIDE GUARDS RUN ON EVERY PULL REQUEST, DOCS-ONLY INCLUDED -- ceo's ruling, not selected by
  # the paths each guard reads. #2329 was docs only, `ts` was SKIPPED (`needs.changed.outputs.ts` is false for
  # a diff with no code in it), and `control-plane-checkout-is-one-fact.test.ts` -- which scans every file
  # under `docs/` -- first ran in trunk-guard's unscoped suite and turned `main` red at `5521677a0`. The
  # change scoping assumes prose cannot break a test; a guard whose POPULATION is the tree is the
  # counter-example, and it is #704's point again: a green run scoped to one diff does not predict it.
  #
  # UNCONDITIONAL, so this job's `if:` is deliberately NOT `needs.changed.outputs.*`: a path-to-guard table
  # is a second list that drifts, where the population (`tree-wide-guards.ts`) is derived from the tree.
  # `needs: changed` alone means a closed PR (which skips `changed`) skips this too, and an empty diff is
  # already refused by `changed`. `verify-matches-ci.test.ts` pins that this stays unconditional.
  #
  # #3211: UNCONDITIONAL ON THE DIFF, NOT ON THE EVENT. A body edit or a label moves no file, and the code run for
  # this head has already swept this tree, so a `meta` event does not sweep it again (see `gate`, which makes that
  # safe: it does not report green on a head whose code run has not concluded green).
  guardSweep:
    needs: changed
    if: ${{ !contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) }}
    runs-on: ubuntu-latest
    steps:
      # Full history for the same reason as every job that reads git: several guards spawn git against the
      # checkout, and a shallow one answers differently from trunk-guard's full-history run.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: The tool at the newest release tag, cloned for this run, with `agent-org` on PATH (#3534)
        run: node scripts/agent-org-newest-tag.ts --dest="$RUNNER_TEMP/agent-org"
      - run: pnpm run build
      # `GH_TOKEN` because the packaging guards in the population shell out to `gh`, as `ts`'s own test step does.
      - name: Every tree-wide guard, on this tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm run guards:sweep

  # #298 (pipeline unit 1): WITH `strict=false` (#277), branch protection no longer requires this head to
  # contain `main`'s current tip before merging -- it merges the instant `gate` is green for the RECORDED
  # head. `strict` bought head-vs-tip agreement for free; without it, nothing does, and #195 (GitHub's
  # recorded head disagreed with the branch's real tip -- #294) is exactly the defect a bare auto-arm
  # workflow would have let through.
  #
  # HEAD-VS-TIP ONLY, DELIBERATELY -- not ancestry (#182) and not closing-claim (#262), both of which
  # `merge-guard.mjs` can also check. `dispatcher` drove `mergeSafetyVerdict` against the real, moving PR
  # queue and measured both refusing the NORMAL case: with merges landing roughly one a minute, almost
  # every open PR is behind `main` almost all the time (13 of 13 checked), and a CI job has no session
  # identity to compare against a claimed row's holder, so closing the exact row a PR was built for --
  # the ordinary worker-owned shape -- reads as discarding a stranger's work. A required job refusing the
  # normal case is not a gate, it is a wall everyone routes around; see `mergeSafetyVerdict`'s own comment
  # in `packages/agent-org/src/merge-guard.mjs` for the measurements. Both stay useful ADVICE in `merge-guard.mjs`'s
  # plain CLI mode, which knows who is asking and is run by a person, never by this job.
  #
  # UNCONDITIONAL, NOT GATED ON `ci-changed.ts`. Every other job here answers "did the DIFF change
  # something this checks" -- head-vs-tip is a fact about the COMMIT, true or false regardless of which
  # files moved, so there is no diff shape that makes this safe to skip.
  #
  # NEVER `mergeReadiness` -- `packages/agent-org/src/merge-guard.mjs --ci-gate` calls the narrower `mergeSafetyVerdict`,
  # which deliberately never inspects check-run CONCLUSIONS. This job's own siblings (`ts`, `python`, ...)
  # are still in flight while it runs, in the SAME workflow run -- a check asking "did every required
  # context conclude" about a commit it is itself currently testing would read STILL_RUNNING on every
  # ordinary push, forever, and block every merge rather than only the unsafe ones. `gate` below already
  # answers "did CI pass" by construction; this answers the one question `strict` used to.
  # #902: WHAT SURVIVES OF `mergeSafety`, AND WHY IT IS STILL REQUIRED -- TWO CHECKS A PERSON'S OWN
  # DECISION DRIVES, and nothing else. What it lost is its authority over the five process jobs, which is
  # the trim itself. What it keeps, none of it process noise -- NONE of the last forty red `ci` runs was any
  # of these. (A third lived here -- a crossing into another session's lane -- until #916 replaced it with
  # CODEOWNERS; see that retirement note further down.)
  #
  #   * A HELD PR MUST NOT MERGE. `hold:` is the one control a person reaches for to stop a specific pull
  #     request. `pr-hold.mjs` disarms auto-merge when it takes a hold and `auto-arm.yml` will not arm a
  #     held PR, but the window pr-hold's own comment calls "the dangerous half" -- armed, then held -- is
  #     caught HERE and nowhere else in CI. It must block, not merely report.
  #   * WHAT THE BODY DECLARES MUST MATCH WHAT GITHUB WILL CLOSE (#549). `pr:open`/`pr:edit` parse the body
  #     and ask whether the declaration is WELL FORMED; only this step has a token and asks whether it
  #     matches what GitHub will actually close. Different questions, and the acceptance job still has no
  #     token by design.
  #   (A CROSSING INTO ANOTHER SESSION'S LANE used to be assigned or refused here. ceo ruled this one twice
  #     on 2026-09-11: first that it could go, since ceo owns the pipeline lane and assigns every crossing
  #     with a `Lane-exception:` line -- then, on worker-capture's objection, that the first ruling covered
  #     only ASSIGNED crossings. An UNASSIGNED one would merge silently, and the record ceo relied on was
  #     the line this check enforced. Its 2026-09-15 retirement date passed with no replacement built, so
  #     it was retired anyway -- accepting the gap rather than blocking every PR forever on a rule nobody
  #     could satisfy. #916 is that replacement: `CODEOWNERS` at the repo root now requests ceo's review
  #     (`@DanBeckDev`) on any PR touching `.github/workflows/`, GitHub-native rather than a CI job, so a
  #     merge with `required_pull_request_reviews` off still SHOWS the crossing even though it cannot yet
  #     block one -- see the file's own header for what would have to change to make it block.)
  #
  # The hold refusal arrives through `merge-guard.mjs --ci-gate`, which also carries #294's head-vs-tip race
  # (does this head match what GitHub recorded for the branch). That is NOT #277's "behind main", which
  # branch protection's `strict` now owns -- it is the racy-push case, it fires rarely, and it is not among
  # the ten reds this row measured for this job.
  #
  # EXEMPT ON `merge_group`, RECORDED (#1109) -- `gate-needs.test.ts`'s `EXEMPT_ON_MERGE_GROUP` pins this
  # same reason so the exemption cannot drift silently apart from what actually skips. All three steps read
  # `github.event.pull_request` (the hold check, and #549's Closes comparison against the PR body), which a
  # `merge_group` event carries none of -- there is no PR body, no PR number, nothing to diff a `Closes:`
  # line against. Not widened to run there: a queue entry has no author-editable body left to re-check.
  deliberateRefusals:
    needs: bodyEdit
    if: github.event_name == 'pull_request' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` because the lane step below diffs `origin/<base>...HEAD`, and a three-dot diff
      # needs a MERGE BASE. On the default shallow checkout there is none, and git does not degrade: it
      # exits 128 with `fatal: ...: no merge base`, which under `bash -e` fails the step BEFORE the check
      # runs. Measured 2026-09-09 by reproducing it in a `--depth=1` clone, after the check refused its own
      # first PR and the refusal was nothing to do with lanes. `ownedPaths` already carries this for the
      # identical reason and is the shape copied here -- a check that cannot ask must say so, and one that
      # cannot even start says something worse: a real-sounding failure with the wrong cause on it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: The tool at the newest release tag, cloned for this run, with `agent-org` on PATH (#3534)
        run: node scripts/agent-org-newest-tag.ts --dest="$RUNNER_TEMP/agent-org"
      - run: pnpm run build
      - name: This head matches what GitHub recorded (#294)
        env:
          GH_TOKEN: ${{ github.token }}
        run: agent-org merge-guard --ci-gate ${{ github.event.pull_request.number }}
      # #549: WHAT THE BODY DECLARES MUST MATCH WHAT GITHUB WILL ACTUALLY CLOSE. `Closes: none` in the
      # body and a real closure of two issues both merged the same day -- neither the acceptance job (no
      # GH_TOKEN, by design) nor anything else compared the two. This is a NEW step, not folded into
      # `merge-guard.mjs --ci-gate`'s own `mergeSafetyVerdict` above: that function is deliberately scoped
      # to head-vs-tip ONLY, because its sibling rules (ancestry, closing-claim) were measured refusing the
      # NORMAL case when asked unconditionally in CI -- see its own header. This check has the opposite
      # property (silent on every well-formed PR), so it does not share that hazard and does not belong
      # inside that narrowly-scoped composition.
      - name: The declared Closes matches what GitHub will actually close (#549)
        if: needs.bodyEdit.outputs.proseOnly != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: agent-org closes-mismatch-check ${{ github.event.pull_request.number }}
      # THE LANE CHECK WAS HERE, AND IS RETIRED (#916's date, 2026-09-15, passed without its CODEOWNERS
      # replacement being built -- built afterward, in #916 itself). It refused any PR touching
      # `.github/workflows/` unless it came from a `ceo/` branch or carried a `Lane-exception:` line naming
      # an assigner -- which an outside contributor cannot produce, and it was the only guard in `gate`'s
      # needs that they could not satisfy.
      # `docs/lane-ownership.json` survives as DATA: `row-file.mjs` still derives a row's `lane:<owner>`
      # label from it through `packages/agent-org/src/lane-ownership.mjs`. A lane is still a recorded fact
      # about who owns a path -- it is no longer a wall in CI, but the root `CODEOWNERS` file now reads the
      # same fact (the pipeline lane's owner and its `except` carve-out) so a PR touching `.github/workflows/`
      # requests review rather than passing unnoticed. `codeowners-lane-sync.test.ts` pins the two against
      # each other so they cannot drift back apart the way #939 warned about for the check this replaced.

  # #353 (pipeline unit 2): NOTHING HAS EVER RUN A ROW'S ACCEPTANCE COMMAND. Every PR body carries an
  # `Acceptance:` line and argues its own case; the only thing that has ever executed it is the author,
  # reporting the result in prose. `capture-check` was mandatory after any `capture-core.mjs` change and
  # had never run once; `scorer:verify` was a security check on the one artefact this project publishes
  # and nothing invoked it; `release:gate` was broken from the day it was written. This is the thing that
  # actually runs it -- see `packages/agent-org/src/acceptance-commands.mjs`'s own header for the three outcomes
  # (RAN/REFUSED/MISSING) and why they must never collapse into two.
  #
  # `pull_request`, NEVER `pull_request_target` -- this job executes commands an author wrote in a PR
  # body. `pull_request` runs against the FORK's own checkout with a read-only token, which is the correct
  # blast radius for "run whatever this PR says to run"; `pull_request_target` would run those same
  # commands with the BASE repo's token and secrets, turning a line in a PR description into arbitrary
  # code execution with write credentials. `permissions: contents: read`, explicitly, and nothing else --
  # this job never writes anything.
  #
  # UNSCOPED AND UNCONDITIONAL, like `mergeSafety` -- every PR needs its acceptance verified regardless of
  # which files changed, and a missing `Acceptance:` line must fail even a docs-only PR.
  # A1 (#452): CALLS `reusable-acceptance.yml` -- see that file for the full reasoning, restated there
  # because after this split it is the ONLY place a reader would think to look for this job's blast
  # radius (the author's command gets no token, contents:read + pull-requests:read for the one step that reads the live
  # body, pull_request never pull_request_target).
  #
  # EXEMPT ON `merge_group`, RECORDED (#1109) -- `gate-needs.test.ts`'s `EXEMPT_ON_MERGE_GROUP` pins the
  # same reason. This job runs a command out of `github.event.pull_request.body`; a `merge_group` event has
  # no pull request and no body to run. Not widened: there is nothing here left to execute on a queue entry.
  acceptance:
    needs: bodyEdit
    # #4413: NOT FOR A PROSE-ONLY BODY EDIT (`bodyEdit`, above). The verdict is a function of the Acceptance block and its neighbours, none of
    # which that edit touched, and the code run for this head has already given it.
    if: github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && needs.bodyEdit.outputs.proseOnly != 'true'
    # A CALLED WORKFLOW CAN ONLY NARROW ITS CALLER'S TOKEN, so `pull-requests: read` is granted here too (#3286): the
    # called job reads the LIVE body with it, in the one step that holds a token. No `with:` -- the body is no longer
    # an input, because the event payload's body is the stale one on a Dependabot `opened` run.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/reusable-acceptance.yml

  # THE ONE CONTEXT BRANCH PROTECTION REQUIRES. `if: always()` so this still runs when an upstream job
  # fails or is cancelled -- without it, a failing `ts` would skip `gate` too (the default `if` on a job
  # is `success()` on its dependencies), and a job that never reports on the one commit that most needs it
  # blocked is worse than one that reports failure.
  #
  # `needs.*.result` is one of success | failure | cancelled | skipped -- never absent, so every job named
  # in `needs:` below has an opinion here regardless of whether `ci-changed.ts` decided it should run.
  # skipped counts as passing (the job's own `if:` decided it, correctly, that this PR does not need it);
  # anything else does not.
  # A CHANGE TO A CORPUS-INVALIDATING PATH MUST NAME THE FACTS IT DID NOT MOVE -- #356.
  #
  # NOT a CODEOWNERS review, and the reason is measured: every session pushes as the same account, so
  # `gh pr review --approve` answers "Can not approve your own pull request" -- and a review would have
  # caught NONE of the failures these paths have actually had. Each was a correct-looking change whose
  # consequence was invisible at the diff (a memo stale for five days; a remedy guarded on a flag nothing
  # set; a census stripped at export). This asks for FACTS AND THEIR STATES instead, because writing the
  # state is what makes an author look.
  #
  # The fact list is `docs/owned-path-facts.json`, which `orchestrator` owns -- data, so the owner can
  # correct it without touching the mechanism, and so the mechanism cannot quietly decide what the
  # facts are.
  #
  # EXEMPT ON `merge_group`, RECORDED (#1109) -- `gate-needs.test.ts`'s `EXEMPT_ON_MERGE_GROUP` pins the
  # same reason. The diff step below reads `github.base_ref`, empty on a `merge_group` event (its base
  # lives at `github.event.merge_group.base_ref` instead, a different shape -- see `changed`'s own `base`
  # step for the two). Not widened to read the other field: a queue entry's own PR already passed this
  # check to be armed, so there is no new declaration here to re-check against.
  ownedPaths:
    needs: [changed, bodyEdit]
    # #4413: skipped for a prose-only body edit, as `acceptance` is.
    if: github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && needs.bodyEdit.outputs.proseOnly != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: The tool at the newest release tag, cloned for this run, with `agent-org` on PATH (#3534)
        run: node scripts/agent-org-newest-tag.ts --dest="$RUNNER_TEMP/agent-org"
      - name: Which paths did this PR change, and does its body sign them off?
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > /tmp/changed.txt
          printf '%s' "$BODY" > /tmp/body.txt
          agent-org owned-path-signoff --diff=/tmp/changed.txt --body=/tmp/body.txt

  # #902, step 2 of the CI Reset (chairman-approved): THE REQUIRED CHECK IS THE PRODUCT, NOT THE PROCESS.
  # Of the last forty red `ci` runs on pull requests, 13 were `ts` -- a real test, lint or typecheck
  # failure -- and the rest were the process jobs: `acceptance` 10, `mergeSafety` 10, `docs` 9,
  # `changed`/`ownedPaths` 5. Two of every three red pull requests were red for something that said
  # nothing about whether the code works.
  #
  # THE FIVE ARE DROPPED FROM `needs`, NOT DELETED: `docs`, `board`, `acceptance`, `ownedPaths` and
  # `mergeSafety` still run on every pull request and still report their own verdict. They stop deciding
  # whether it can merge. Where each one's authority goes is on #902; the load-bearing one is
  # `mergeSafety`'s head-versus-tip check, which branch protection's "require branches to be up to date"
  # now enforces natively -- ceo turned `strict` on at 21:5xZ on 2026-09-11, BEFORE this landed, which is
  # #928's rule: never retire a watcher before its replacement is answering.
  #
  # `!cancelled()`: a cancelled run's jobs report `cancelled`, which is neither success nor skipped, so
  # this step FAILED every time a push superseded its own run -- and that failure then sat on the head as
  # a `gate` check-run beside the real one. Two sessions read #996 as red from exactly that on
  # 2026-09-11. A superseded run should report nothing, not a red.
  # `acceptance` AND `ownedPaths` ARE BACK IN THIS LIST -- 2026-09-17, reversing the half of #902 that
  # removed them.
  #
  # `gate` is the ONLY required check on `main` (measured: branch protection's contexts are exactly
  # `["gate"]`, and required approvals are 0). A job outside this list therefore runs, reports, and is
  # IGNORED -- it cannot block anything. Two pull requests merged red in two days that way, and the
  # second one was red while its own acceptance command had RUN AND PASSED.
  #
  # A check that cannot block is worse than no check: it teaches everyone to scroll past red, which is
  # the habit that makes the checks that DO matter unreadable. So each of these is now one or the other,
  # and these two are worth blocking on: `acceptance` is the only thing that ever EXECUTES a pull
  # request's own stated acceptance command (#353 exists because nothing ever had), and `ownedPaths` is
  # the only reader of the owned-path declarations.
  #
  # WHY THIS DOES NOT REPRODUCE #902's COMPLAINT, which was real: two of every three red pull requests
  # were red for something that said nothing about whether the code works. Measured over the last 40
  # pull-request runs, `acceptance` failed 4 times and caught ZERO broken builds -- all four were PR-BODY
  # defects (twice a duplicated `Acceptance:` section, twice a missing `Closes` declaration), and in the
  # two most recent the command itself had already reported `pass (exit 0)`. Those are fixable by the
  # author in a minute, and `edited` is in this workflow's trigger list, so a corrected body re-runs the
  # check. That trigger is what turned the 2026-09-07 deadlock (a body-only defect with no trigger that
  # watched the body) from a queue stall into an edit -- the condition that made blocking unsafe then
  # does not hold now.
  gate:
    needs: [bodyEdit, changed, ts, python, ansible, changeset, rulesFitness, guardSweep, deliberateRefusals, acceptance, ownedPaths]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    # `actions: read` for the one lookup below, and nothing else: this job checks nothing out and writes nothing.
    permissions:
      actions: read
    steps:
      - name: Every job that ran, ran clean
        run: |
          for result in \
            "${{ needs.bodyEdit.result }}" \
            "${{ needs.changed.result }}" \
            "${{ needs.ts.result }}" \
            "${{ needs.python.result }}" \
            "${{ needs.ansible.result }}" \
            "${{ needs.changeset.result }}" \
            "${{ needs.rulesFitness.result }}" \
            "${{ needs.guardSweep.result }}" \
            "${{ needs.deliberateRefusals.result }}" \
            "${{ needs.acceptance.result }}" \
            "${{ needs.ownedPaths.result }}"
          do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::a job reported '$result', which is neither success nor skipped"
              exit 1
            fi
          done
      # #3211: THE TWO KINDS OF RUN ON ONE HEAD MUST AGREE, AND EACH `gate` CHECKS THE OTHER KIND.
      #
      # A body or label run (`meta`) skips the heavy jobs above, and the loop reads `skipped` as passing -- so on its own
      # a label would report `gate` green on a head whose tests are still running, or failed. That is `edited`'s own
      # lesson inverted: the 2026-09-07 deadlock was a check reading an input no trigger watched; this would be a check
      # reporting on work it did not do. So a meta run's `gate` waits for the code run of the same head and is green
      # only if it concluded `success`. It is pending (this step polling), never green and never red, while there is none.
      #
      # THE OTHER DIRECTION IS THE ONE THE ROW DID NOT NAME. The kinds run in separate concurrency groups, so a hold
      # label (or a broken body) can land and be checked while the code run is still going. Its `gate` would be red and
      # then the code run's `gate`, finishing later, would be green over it: whichever check run counts as the latest
      # (not documented, and not something to rest a merge on) the answer would depend on which finished last. So a code
      # run's `gate` also reads the body checks of the newest meta run that started after it did. It reads that run's
      # JOBS, never its `gate`: the meta `gate` is waiting for this run, and waiting on each other would be a deadlock.
      #
      # EITHER WAY BOTH `gate`s COMPUTE ONE ANSWER FROM ONE FACT, so it does not matter which one a reader takes.
      # The other kind's runs are found by `run-name` (top of this file): meta titles end `[meta event, <action>]`. A PR
      # title that spoofs the marker makes a code run look like a meta run, which hides it, so the step waits and then
      # fails: the safe direction.
      #
      # #4413: A RUN THAT CONCURRENCY CANCELLED IS NEVER A VERDICT, ONLY "WAIT FOR ITS REPLACEMENT". `cancel-in-progress` (top of this
      # file) cancels the previous run of a group when a newer one starts, so a cancelled sibling always has a newer run of its kind and
      # says nothing about the work. The first version of this step let `cancelled` fall into its catch-all arm and FAILED a green
      # pull request on one (#4406: a PR-body edit's meta run, cancelled by the next one, turned the code run's `gate` red until someone
      # re-ran both). So `other_run` never selects a cancelled run (it reads the newest one that is not), `jobs_verdict` reads a cancelled
      # JOB as pending (the run listing is read again on the next poll and drops that run), and the `case` has no arm in which
      # `cancelled` fails. DO NOT ADD `cancelled` BACK TO THE FAILURES. A genuine `failure` still fails and `success` still passes
      # (`ci-agreement-step-cancelled.test.ts` runs this very script on fixture listings, both directions).
      #
      # WHEN EVERY SIBLING IS CANCELLED there is nothing to agree with yet: a code run says so and goes on (a meta run that replaced
      # it is on the list, and a hand cancel is no verdict on the work), a meta run keeps polling for a code run and, if none comes,
      # names the cancelled runs to re-run. That is a missing verdict, never a failure of the work.
      - name: The other kind of run on this head agrees (#3211)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          KIND: ${{ contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) && 'meta' || 'code' }}
          ATTEMPTS: 180
          POLL_SECONDS: 20
        run: |
          # stdin: the listing of this workflow's runs on the head. Prints the id of the run to read, or `none`.
          # `other_run` (the default, `live`) never selects a cancelled run; `other_run cancelled` lists the ones it skipped.
          other_run() {
            jq -r --arg self "$GITHUB_RUN_ID" --arg kind "$KIND" --arg which "${1:-live}" '
              def is_meta: (.display_title // "") | test(" \\[meta event, [a-z]+\\]$");
              ([.workflow_runs[] | select((.id | tostring) == $self) | .created_at] | first) as $mine
              | [.workflow_runs[]
                  | select((.id | tostring) != $self)
                  | select(if $kind == "meta" then (is_meta | not) else (is_meta and .created_at > $mine) end)
                  | select((.conclusion == "cancelled") == ($which == "cancelled"))]
              | sort_by(.created_at)
              | if $which == "cancelled" then map(.id | tostring) | join(" ")
                else (last | if . == null then "none" else (.id | tostring) end) end'
          }
          # stdin: one run object. A meta run is read through its jobs (not `gate`), a code run through its conclusion.
          run_verdict() {
            jq -r 'if .status != "completed" then "pending" else (.conclusion // "none") end'
          }
          # stdin: a run's jobs. Pending while any non-gate job is unfinished or cancelled (a cancelled run is replaced, see above),
          # else the first bad conclusion, else success.
          jobs_verdict() {
            jq -r '[.jobs[] | select(.name != "gate")] as $jobs
              | if ($jobs | length) == 0 or any($jobs[]; .status != "completed" or .conclusion == "cancelled") then "pending"
                else ([$jobs[] | .conclusion | select(. != "success" and . != "skipped")] | first // "success") end'
          }
          verdict=none
          for _ in $(seq 1 "$ATTEMPTS"); do
            runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100")
            other=$(printf '%s' "$runs" | other_run)
            if [ "$other" = none ]; then
              # No meta run after this code run: nothing to agree with. No code run yet for a meta run: pending.
              if [ "$KIND" = code ]; then
                echo "no body or label run followed this code run (cancelled, not counted: '$(printf '%s' "$runs" | other_run cancelled)')"
                exit 0
              fi
              verdict=none
            elif [ "$KIND" = meta ]; then
              verdict=$(printf '%s' "$runs" | jq -c --arg id "$other" '.workflow_runs[] | select((.id | tostring) == $id)' | run_verdict)
            else
              verdict=$(gh api "repos/$REPO/actions/runs/$other/jobs?per_page=100" | jobs_verdict)
            fi
            case "$verdict" in
              success) echo "the other kind of run on $HEAD_SHA ($other) concluded success"; exit 0 ;;
              none | pending) sleep "$POLL_SECONDS" ;;
              *) echo "::error::the other kind of run on $HEAD_SHA ($other) concluded '$verdict', so this run cannot report green"; exit 1 ;;
            esac
          done
          skipped=$(printf '%s' "$runs" | other_run cancelled)
          echo "::error::the other kind of run on $HEAD_SHA has no conclusion ('$verdict') after $ATTEMPTS polls; this run is not green on work it did not see${skipped:+ (cancelled by concurrency or by hand, and not a verdict: $skipped; re-run the newest of them)}"
          exit 1
