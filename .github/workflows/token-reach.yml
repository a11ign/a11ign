# DOES `A11IGN_BOT_TOKEN` REACH THIS REPOSITORY ON THE WRITE SIDE? -- #3710, measured 2026-10-05; moved here from `release.yml` by #3717.
#
# The token's reach used to be learned by the first release that died on it (`toolchain`'s `release` 37356801652, `Resource not
# accessible by personal access token`, #3578), and its scope is readable only by its owner (403 for every agent). This workflow
# asks the token itself, and `layer-repository-protection.test.ts`'s `token` cell reads the LATEST run of a job NAMED `token-reach` in
# the workflow `docs/code-repository-protection.json` names (`tokenProbe`), so the job's name is a contract and is the same in every
# code repository.
#
# WHY A FILE OF ITS OWN. `release.yml` held it until #3717, which deleted the version pull request and with it that file's last
# reason to hold the token (the release workflow calls a reusable one that needs none, and a test pins that no `A11IGN_BOT_TOKEN`
# is read there). `auto-arm.yml`, where the token's lasting user lives, is pinned at exactly two reads of the secret by
# `agent-org`'s `auto-arm-token.test.ts`, and `nightly.yml` likewise, so a third read in either would be a change to a pull request
# in another repository. A separate file is read by neither pin.
#
# WHAT RUNS IT: a daily schedule and `workflow_dispatch`. It used to run on a release push; a release no longer touches the token,
# and what the cell wants is a reading that is not stale, so a clock is the honest trigger. A reading at a moment, per run, never a
# standing certificate. A dispatch of `main` is the way to get a reading on demand.
#
# A READ OF A REF IS NOT THE INSTRUMENT: every code repository is public and a ref read answers 200 with no credential at all. Two
# probes that WRITE NOTHING, each measured against four credentials on all eight repositories (runs 37383283351 and 37383468910, the
# row #3710 comment): the push service's advertisement (`git-receive-pack`: 200 for the token, 401 for none, 403 for a read-only or
# wrong-repository `GITHUB_TOKEN`), and `POST /pulls` with an empty body (422 `Invalid request` when authorised, so nothing is
# created; 401/403 otherwise). Together they are the two things an arm needs, contents write and pull-requests write. Refuted:
# `PATCH /pulls/0` (404 for a read-only credential too) and `.permissions.push` (absent for an installation token). NOT VERIFIED: a
# PAT scoped read-only; the verdict keys on the status, never on the 403's wording.
#
# IT GATES NOTHING: no job `needs` it, and `arm` (`auto-arm.yml`) keeps its documented `GITHUB_TOKEN` fallback, because stopping every
# arm for a token problem is worse than the degradation this reports.
name: token-reach

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  token-reach:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Probe the token's reach on the write side, failing with a TOKEN-REACH line that names the cause
        env:
          A11IGN_BOT_TOKEN: ${{ secrets.A11IGN_BOT_TOKEN }}
        run: |
          repo="$GITHUB_REPOSITORY"
          say() { echo "::error::TOKEN-REACH $repo: $1"; exit 1; }
          [ -n "$A11IGN_BOT_TOKEN" ] || say "A11IGN_BOT_TOKEN is not set, so nothing here can push, open or arm a pull request with it"
          status() { curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "$@" || true; }
          basic=$(printf 'x-access-token:%s' "$A11IGN_BOT_TOKEN" | base64 -w0)
          push=$(status -H "Authorization: Basic $basic" "https://github.com/$repo.git/info/refs?service=git-receive-pack")
          pulls=$(status -X POST -H "Authorization: Bearer $A11IGN_BOT_TOKEN" -d '{}' "https://api.github.com/repos/$repo/pulls")
          if [ "$push/$pulls" = "200/422" ]; then
            echo "TOKEN-REACH $repo: ok (push service 200; POST /pulls 422, authorised, nothing created)"
            exit 0
          fi
          for s in "$push" "$pulls"; do
            case "$s" in 000|5??) say "CANNOT_TELL the probe could not ask (push $push, pulls $pulls); this is not a reading of the token" ;; esac
          done
          [ "$push" = 200 ] || say "the token cannot push here: the push service answered HTTP $push (401: rejected, expired or revoked; 403 or 404: it does not reach this repository, or only reads it)"
          say "the token pushes but cannot open or arm pull requests here: POST /pulls answered HTTP $pulls where 422 was wanted (403: it lacks pull-requests: write)"
