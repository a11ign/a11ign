# The publish path. IT RELEASES ON THE MERGE ITSELF, WITH NOBODY TYPING AND NO VERSION PULL REQUEST (#3717, chairman's CI/CD
# direction, #928; the same shape as a11ign/toolchain's own release, #3713).
#
# The name is settled (`a11ign`, PLAN.md B5, #1530) and the first release has shipped: `a11ign@0.1.0` and
# five `@a11ign/*` packages went to the public registry on 2026-09-19T09:39:12Z, from `b373d1d7`. This
# workflow exists so that releasing is a reviewed config change rather than someone improvising
# `npm publish` across interdependent packages at the moment they are least able to check the result.
# npm versions cannot be unpublished after 72 hours, only deprecated, so a wrong release is permanent.
#
# #2052 — WHY THE SENTENCES ABOVE NAME A DATE. Until 2026-09-23 this header stated in the present tense that nothing had ever
# been published, and quoted an access setting the file had not had since 2026-09-14. A comment asserting the current state of
# something OUTSIDE this file — a registry, a sibling config — reads as authoritative precisely because somebody troubled to
# write it, and has nothing keeping it true. `release-header-currency.test.ts` reads `.changeset/config.json` itself and
# checks every place here that quotes it, so gate 4 below cannot drift from the file it quotes again.
#
# THIS FILE IS A CALLER. The release itself (the version commit on no branch, the publish by OIDC, the tags and Releases) is
# `release-per-merge.yml` in a11ign/toolchain (#3712), one reusable workflow for every repository, pinned below by FULL SHA and
# moved by this repository's Dependabot `github-actions` entry in a pull request. A push to `main` that carries a changeset no
# tag has consumed is versioned on a DETACHED COMMIT, published and tagged: `main` is never written, its versions and changelogs
# lag the last tag, and no version pull request exists. What replaced the one this file used to open (`version-pr`, with
# `A11IGN_BOT_TOKEN`) is that commit; what it consumes is read off the tags, so the registry is no longer the state this file
# reads. A failed release is re-run from its push run (the platform's "re-run failed jobs"): the same sha, the same release.
#
# SEVEN INDEPENDENT THINGS must all be true before a single byte is published. They are independent on
# purpose: any one of them alone would be a single point of failure, and this repo's own rule is that a
# verification must not share a failure mode with the action it guards.
#
#   1. Only a push to `main` can publish, and the called workflow refuses any other ref in its first job. This file's `release`
#      job runs on `push` only, so no other event reaches the call.
#   2. A `workflow_dispatch` cannot publish. It runs every guard below and stops: the `release` job is `if: push`, and the
#      `npm-publish` environment the called `publish` job runs under is restricted to `main` (a dispatch from a branch, whose
#      file is the branch author's, is never minted the OIDC token).
#   3. Nothing here writes `main`, opens a pull request or holds `A11IGN_BOT_TOKEN`. The called workflow writes tags and
#      nothing else; the approving review `main` requires (#2022) stands where the typed confirmation once stood.
#   4. `.changeset/config.json` must say `"access": "public"`, and the `guards` job reads the file back rather than assuming it
#      (the called `publish` job reads it again before it sends anything). It reads `public` today; it was flipped there on
#      2026-09-14 (#1530), and a scoped `@a11ign/*` package cannot publish under anything else at all.
#   5. `action-smoke` must SUCCEED, run HERE, against the exact sha this workflow ran at. It drives the published Action the
#      way a consumer does — `uses: ./`, inputs only, no repo knowledge.
#   6. `capture-regression` must SUCCEED, run HERE, against the same sha. It drives real NVDA over the bundled tutorial pages.
#   7. `consumer-gate` must SUCCEED, run HERE (#494). `consumer-gate.yml` is generated from README.md's own Quickstart fence and
#      its workspace starts empty: the ONE check here that exercises the path a first reader actually takes.
#
# Removing any of the seven is a deliberate act. Do not remove them in the same change that changes what starts this.
#
# THE GUARDS ABOUT WHAT IS PUBLISHED ALL STAY, and are steps of the `guards` job that `release` NEEDS (the called workflow takes
# no steps of the caller's, so a guard is a job it waits for): the fleet part's qualification verdict (#3136), the coverage
# threshold, the part of `release:gate` a runner can prove, `consumer-gate.yml`'s currency, the packed-install check
# (`gate:isolation`), the manifest-repository check, the hold on packages that have left (#3126), the access read-back, the
# refusal to publish older than the registry (#3167), the npm floor and the provenance request. `release-triggers-itself.test.ts`
# pins each of them, and `release-safety.test.ts` says which moved where. THEY RUN ON THE `main` TREE, NOT ON THE RELEASE COMMIT
# (that commit exists only inside the called workflow, after them), which is why a version bump they would have seen on `main`
# under the version pull request is not what they read now.
#
# `dist-tag` (issue #326) is gone (#3131): a push publishes to "latest", which is changesets' own default with no flag.
name: release

on:
  # `paths` keeps this off the ordinary merge: a release is due when a changeset arrives, and a changeset is a file under
  # `.changeset/`. What a tag has not yet consumed is subtracted by the called workflow, so a changeset whose release failed is
  # released by the next run that reaches the call, never twice. `push-trigger-allowlist.test.ts` pins that no catch-all is here.
  push:
    branches: [main]
    paths: [".changeset/**"]
  # THE REHEARSAL, KEPT (#3717): a person may run every guard below on any branch and publish nothing. The called workflow has no dry
  # run, so the rehearsal is the guards alone and the `release` job is skipped by its own `if`.
  workflow_dispatch:

# ONE RELEASE AT A TIME, AND NEVER CANCELLED IN FLIGHT. A publish that is cancelled half way leaves some packages on the
# registry and some not, and a registry cannot be rolled back. GitHub holds ONE run pending behind the running one and drops
# older pending runs, which loses nothing: the called workflow subtracts what the tags consumed, so the newer run releases both.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # GUARDS 5, 6 AND 7, RUN AS JOBS AGAINST THE EXACT SHA THIS WORKFLOW RAN AT. `uses:` a local workflow path calls it as a
  # reusable workflow (`workflow_call`); GitHub runs a called workflow at THIS workflow's own ref.
  action-smoke:
    uses: ./.github/workflows/action-smoke.yml

  capture-regression:
    uses: ./.github/workflows/capture-regression.yml

  # #494. `consumer-gate.yml`'s own `check-pin` job (#558) compares its pinned sha against `${{ github.sha }}`, which under
  # `workflow_call` is THIS release's own sha, so a stale pin fails here on ubuntu-latest before the Windows job starts.
  consumer-gate:
    uses: ./.github/workflows/consumer-gate.yml
    # #1251. A called workflow may not request more than its caller grants, and this repository's default GITHUB_TOKEN is
    # read-only. consumer-gate.yml is generated from README.md's Quickstart fence, which gained `pull-requests: write` for the
    # Action's optional PR-comment step, so the grant lives HERE and not in the generator: the generated file must stay
    # exactly what a reader copies. It is NOT a version pull request signal; #3718's release-shape cell reads it as one, and the
    # row that narrows it is on #3717. `release-safety.test.ts` pins that every permission a called job requests is granted.
    permissions:
      contents: read
      pull-requests: write

  # EVERY GUARD ABOUT WHAT IS PUBLISHED THAT IS A STEP, in one job the `release` job needs (see the header). It holds `contents: read`
  # and `statuses: read` and nothing else: no `id-token`, no write. The old `release` job held both writes beside all of these.
  guards:
    runs-on: ubuntu-latest
    # What the verdict step below decided, handed to `qualification-row`: this job must not also hold `issues: write`, so the row
    # is filed by a job that holds nothing else. Empty `row-*` outputs mean no row.
    outputs:
      row-title: ${{ steps.qualification.outputs.row-title }}
      row-labels: ${{ steps.qualification.outputs.row-labels }}
      row-body: ${{ steps.qualification.outputs.row-body }}
    permissions:
      contents: read
      # READ ONLY, for the fleet part's verdict below (#3136): the lab posts a commit status and this job reads it.
      statuses: read
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      # #1452: `changeset status`'s divergence check runs `git merge-base main HEAD`, a literal LOCAL branch named `main`. A
      # dispatch on another branch has `main` only as `origin/main`, so the rehearsal's status below needs this.
      - name: Make a local `main` ref available for changesets' divergence check
        run: |
          if [ "$(git symbolic-ref --short HEAD)" != "main" ]; then
            git fetch origin main:main
          fi

      # #2301: THE PUBLISH PATH IS pnpm'S, and so is the install. `registry-url` stays: it writes the `.npmrc` npm publishes with.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm, registry-url: https://registry.npmjs.org }

      - run: pnpm install --frozen-lockfile
      - name: The tool at the newest release tag, cloned for this run, with `agent-org` on PATH (#3534)
        run: node scripts/agent-org-newest-tag.mjs --dest="$RUNNER_TEMP/agent-org"
      - run: pnpm run build

      # EACH PUBLIC PACKAGE'S MANIFEST AGAINST THE REGISTRY'S LATEST, taken once and handed to the two steps that read it: the
      # qualification verdict (which packages gate it) and the refusal to publish older. AHEAD means STRICTLY NEWER than the
      # registry's latest, never merely "not on the registry": `main`'s manifests have read 0.0.0 while the registry held 0.1.0
      # (#1824), and a package the registry has never heard of (E404) counts as latest 0.0.0. Any OTHER failure (a network error,
      # a 5xx) is CANNOT_TELL and fails this step: "could not ask" must never read as "not published", because the reading that
      # follows from it is a publish. The reasoning goes to stderr (the log); stdout is the readings.
      - name: Read each public package's manifest against the registry
        id: readings
        run: |
          set -euo pipefail
          readings=$(node -e '
            const fs = require("fs");
            const { execFileSync } = require("child_process");
            const fail = (message) => { console.error(`::error::CANNOT_TELL: ${message}`); process.exit(1); };
            const triple = (version) => {
              const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(version);
              if (!match) fail(`${version} is not a plain x.y.z version`);
              return match.slice(1).map(Number);
            };
            const newer = (a, b) => { for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] > b[i]; return false; };
            const latestOnRegistry = (name) => {
              try {
                const latest = execFileSync("npm", ["view", name, "version"], { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] }).trim();
                // ADR 0040 reserves the name of each extracted package with `0.0.0-reserved.0`, and until that package releases it
                // is the latest on the registry. It is a name held, not a release: the same footing as E404. Only that spelling is
                // understood; any other prerelease is CANNOT_TELL.
                return /^0\.0\.0-reserved\.\d+$/.test(latest) ? "0.0.0" : latest;
              } catch (error) {
                if (/E404/.test(String(error.stderr))) return "0.0.0";
                return fail(`the registry did not answer for ${name}: ${error.stderr}`);
              }
            };
            const readings = [];
            for (const dir of fs.readdirSync("packages")) {
              const path = `packages/${dir}/package.json`;
              if (!fs.existsSync(path)) continue;
              const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
              if (manifest.private) continue;
              const latest = latestOnRegistry(manifest.name);
              const isAhead = newer(triple(manifest.version), triple(latest));
              const isBehind = newer(triple(latest), triple(manifest.version));
              console.error(`${isAhead ? "AHEAD of" : "not ahead of"} the registry: ${manifest.name}@${manifest.version} (latest there: ${latest})`);
              readings.push({ name: manifest.name, manifest: manifest.version, latest, state: isAhead ? "ahead" : isBehind ? "behind" : "level" });
            }
            console.log(JSON.stringify(readings));
          ')
          echo "readings=$readings" >> "$GITHUB_OUTPUT"

      # #3136 (ADR 0041, decision 3): THE RELEASE READS THE FLEET PART'S VERDICT, by commit sha, instead of ignoring it. This runner
      # proves what a runner can prove; the stability gate and the NVDA layer need a Windows worker (`release-gate-scope.mjs`
      # names the nine stages). The lab posts a commit status, context `qualification`, on the sha, and
      # `release-reads-qualification.mjs` decides one of FOUR outcomes: `proceed` (success, or no fleet stage gates the packages
      # released), `wait` (absent or pending: NOT a pass), `rerun` (one failure) and `regression` (two). ONLY `proceed` lets
      # this job finish, so the called workflow never starts on anything else. THE LOG NAMES THE OUTCOME AND THE SHA ON EVERY RUN.
      # The writer of the status is #3289, so until it lands a release that includes a fleet-gated package stops here at `wait`:
      # the safe state, and the one a user can see. A wait is RE-RUN once the lab has posted, never polled.
      #
      # A STOP THAT NEEDS A PERSON RAISES A ROW (#3291): `regression`, and a `wait` past the 92-minute bound. This step writes the
      # row's title, labels and body as outputs and the `qualification-row` job files it.
      #
      # A REHEARSAL REPORTS AND CONTINUES, because it publishes nothing and a dispatch on any branch would otherwise always stop here.
      - name: Read the fleet part's verdict for this sha
        id: qualification
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          READINGS: ${{ steps.readings.outputs.readings }}
        run: node scripts/release-reads-qualification.mjs --sha=${{ github.sha }} --readings="$READINGS"

      # THE WHOLE-REPO COVERAGE THRESHOLD, HERE AND ON A NIGHTLY SCHEDULE (`nightly.yml`'s `coverage` job). Nothing else on the
      # release path re-runs the full suite, so a threshold regression a package-scoped PR run could not see would otherwise ship.
      # #1308: BUT NOT TWICE FOR THE SAME SHA. This step reads nightly's own `coverage` JOB conclusion for the EXACT sha being
      # released; no verdict for this sha, or a failed one, and it runs coverage exactly as before.
      - id: coverage-verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-reuses-verdict.mjs --sha=${{ github.sha }}

      - name: Coverage — the whole-repo threshold
        if: steps.coverage-verdict.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm run coverage

      # The full gate, not a subset. NOT `continue-on-error`: a release that ships past its own gate is the thing this file exists
      # to prevent. `release:gate:ci` is the part a runner CAN prove: the artefact is safetensors, the weights have a changelog
      # entry accounting for them, no schema migration is open, and every package is usable when installed from a tarball. The rest
      # must have passed ON THE LAB, and is not wired here (#3131): the step after the consumer-gate check names, on EVERY run,
      # which stages this runner did not run (`release-gate-scope.mjs`).
      - name: The release gate — the part a runner can prove
        run: pnpm run release:gate:ci

      # #558: does the committed `consumer-gate.yml` still match what README.md's documented workflow produces, sha aside? The pin's
      # FRESHNESS is guard 7's own concern (its `check-pin` job). Two different things, and neither alone closes the gap.
      - name: consumer-gate.yml matches README.md's documented workflow (sha aside -- guard 7 checks that)
        run: node scripts/generate-consumer-gate.mjs --check

      # #1397: read from the two chains it describes, so the warning can only ever describe the chain that exists.
      - name: Name what this runner did NOT check
        run: node scripts/release-gate-scope.mjs

      # REHEARSAL ONLY: what the release would do with the changesets pending on this branch. `--verbose` prints `<name> -> <newVersion>`
      # per package; plain `changeset status` prints only a bump level.
      - name: What is pending, before anything is applied
        if: github.event_name == 'workflow_dispatch'
        run: pnpm exec changeset status --verbose

      # PACK, not publish: a pack includes untracked files, so "it worked locally" was never evidence, and a package with no
      # `prepack` ships an empty `dist` on any machine that has not built. #2301: PACKED BY pnpm, INSTALLED BY npm -- the pack is
      # the tool that will publish, the install is the tool a stranger runs -- and the packed `package.json` of every package is
      # read back for a `workspace:` protocol or an internal range its sibling does not satisfy.
      - name: Pack every package, which is what a consumer receives
        run: pnpm run gate:isolation

      # #1536: EVERY PUBLISHED MANIFEST MUST NAME THE REPOSITORY THIS RUN PUBLISHES FROM, and this asks before the registry does: npm's
      # provenance check refuses the PUT otherwise. NO `if:`, deliberately: this is the only place a rehearsal can see the mismatch.
      - name: Every published manifest names the repository this run publishes from
        run: node scripts/manifest-repository-check.mjs

      # NOT AN EIGHTH GUARD (#3126): a TEMPORARY HOLD that each move row's last step lifts, one package at a time, until
      # `@a11ign/screenreader-worker`, `-fleet` and `@a11ign/documents` have released from their own repositories (ADR 0040). The
      # called workflow's `changeset publish` sends EVERY package whose version the registry lacks, so a package that has left and
      # is still here would be published from this repository. On a push only, so a rehearsal and ordinary CI stay green while the
      # packages are still here, and before the called workflow starts, so it goes red before any byte leaves.
      - name: Hold -- refuse to publish packages whose own repositories have not released them
        if: github.event_name == 'push'
        env:
          A11Y_CHECK_RELEASE_HOLD: "1"
        run: |
          set -o pipefail
          # The runner's config path is read from its one owner, never spelled here: `entry-points.test.ts` treats any
          # script path a workflow names as an entry point that must be inert on import, and the config is not one.
          RSTEST_CONFIG="$(node -e 'import("./packages/guards/src/assert-glob-not-empty.mjs").then((m) => { if (m.RSTEST_CONFIG) console.log(m.RSTEST_CONFIG); else process.exit(1); })')" || RSTEST_CONFIG=""
          if [ -z "$RSTEST_CONFIG" ]; then
            echo '::error::CANNOT_TELL: could not read RSTEST_CONFIG, so the hold never ran. Nothing published.'
            exit 1
          fi
          pnpm exec rstest run --config "$RSTEST_CONFIG" \
            --include packages/guards/src/release-publishes-only-what-stays.test.ts \
            --disableConsoleIntercept 2>&1 | tee "$RUNNER_TEMP/release-hold.log"
          # A green exit is not a pass: the PASS line is printed only on the far side of the assertion.
          grep -q 'RELEASE HOLD PASS' "$RUNNER_TEMP/release-hold.log" || {
            echo '::error::CANNOT_TELL: the hold exited green but never printed RELEASE HOLD PASS. Nothing published.'
            exit 1
          }

      - name: Refuse to publish unless .changeset/config.json says public
        run: |
          access=$(node -p "require('./.changeset/config.json').access")
          if [ "$access" != "public" ]; then
            echo "::error::.changeset/config.json has access=$access. It must read 'public': every"
            echo "published package here is scoped (@a11ign/*) and npm refuses a scoped publish under"
            echo "anything else, so this run would fail at the registry instead of here. If that value"
            echo "changed on purpose, change it back in a reviewed commit, not here."
            exit 1
          fi

      # NEVER PUBLISH A VERSION OLDER THAN THE REGISTRY'S LATEST (#3167). The called workflow's `changeset publish` sends EVERY package
      # whose version the registry lacks, and with no `--tag` an older version can move `latest` backwards, which cannot be undone.
      # THE READING IS OF `main`'S MANIFESTS, and the release commit's bases are the last tags' versions where a package has a tag:
      # a tag is cut only by a publish, so it follows the registry and this reading is the one that can disagree with it. A package
      # with no tag keeps `main`'s version, which is exactly what is read here.
      - name: Refuse to publish a package whose manifest is behind the registry's latest
        env:
          READINGS: ${{ steps.readings.outputs.readings }}
        run: |
          node -e '
            const readings = JSON.parse(process.env.READINGS || "null");
            if (!Array.isArray(readings) || readings.length === 0) {
              console.error("::error::CANNOT_TELL: the readings step handed on no registry readings. Nothing published.");
              process.exit(1);
            }
            for (const r of readings) console.log(`${r.state.toUpperCase()}: ${r.name}@${r.manifest} (latest on the registry: ${r.latest}, https://www.npmjs.com/package/${r.name})`);
            const behind = readings.filter((r) => r.state === "behind");
            if (behind.length > 0) {
              const names = behind.map((r) => `${r.name}@${r.manifest} < ${r.latest}`).join(", ");
              console.error(`::error::Behind the registry: ${names}. The publish step would send an older version and could move latest backwards. Nothing published.`);
              process.exit(1);
            }
          '

      # #3180: TRUSTED PUBLISHING NEEDS npm 11.5.1 OR NEWER, and `actions/setup-node` with Node 22 ships npm 10.x. The called workflow
      # installs it for its own publish; THIS is the npm the provenance request below runs with, and the floor is read back from the
      # npm first on PATH, because that is the one pnpm shells out to.
      # STAYS npm (#3180, pinned in `workflows-run-pnpm.test.ts`): `npm install -g` is the only way to upgrade npm itself; pnpm cannot.
      - name: Upgrade npm to the trusted-publishing floor, and refuse below it
        run: |
          npm install -g "npm@^11.5.1"
          have="$(npm --version)"
          printf '%s\n%s\n' 11.5.1 "$have" | sort -V -C || {
            echo "::error::npm $have is below 11.5.1, which trusted publishing needs. Nothing published."
            exit 1
          }

      # THE PROVENANCE REQUEST (ADR 0006: "easy to forget and expensive to retrofit", because provenance attaches at publish time and a
      # version shipped without it can never gain it). The called workflow sets `NPM_CONFIG_PROVENANCE` on its publish, and nothing
      # of this repository's can read that file; so this runs the SAME hand-off the real publish uses (`pnpm publish` -> `npm publish`,
      # `--dry-run`) for every published package, with the same variable, and REFUSES unless the npm at the far end reports provenance
      # on. It reaches the registry-facing code path and stops before the upload, so it publishes nothing: the signing itself happens
      # only on a real publish, and that is the one thing this cannot show.
      - name: The pnpm-to-npm publish hand-off, with provenance requested, publishing nothing
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: node scripts/release-publish-rehearsal.mjs

  # #3291: THE ROW THE VERDICT STEP'S CONTRACT PROMISES. A wait past the measured bound ("raise a row, do not skip") and a confirmed
  # `regression` each stop the release, and nothing else would tell anyone: an overdue wait is otherwise a red run somebody must
  # happen to see. This job files ONE row per release sha, idempotent by title, so a re-run of the failed `guards` job finds the row
  # and files none. It holds `issues: write` and `contents: read` and nothing else. No checkout, no install: it runs `gh` and nothing
  # from the tree, so the one token that may write an issue never meets code from the repository. A rehearsal files nothing, because
  # it publishes nothing and a dispatch on a branch has no release sha worth a row.
  qualification-row:
    needs: [guards]
    if: failure() && github.event_name == 'push' && needs.guards.outputs.row-title != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: File the row for this sha, unless it is already filed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ROW_TITLE: ${{ needs.guards.outputs.row-title }}
          ROW_LABELS: ${{ needs.guards.outputs.row-labels }}
          ROW_BODY: ${{ needs.guards.outputs.row-body }}
        run: |
          set -euo pipefail
          # The title is the row's identity. The search narrows, the exact comparison decides, and `--state all` means a
          # row already closed still counts: ONE row per sha, never a second after the first was dealt with.
          filed=$(gh issue list --state all --limit 100 --search "\"$ROW_TITLE\" in:title" --json title \
            --jq '[.[] | select(.title == env.ROW_TITLE)] | length')
          if [ "$filed" != "0" ]; then
            echo "already filed: $ROW_TITLE"
            exit 0
          fi
          label_args=()
          IFS=',' read -ra labels <<< "$ROW_LABELS"
          for label in "${labels[@]}"; do
            # Create only what is missing: `gh label create --force` would repaint a label that exists.
            present=$(LABEL="$label" gh label list --limit 1000 --json name --jq '[.[] | select(.name == env.LABEL)] | length')
            if [ "$present" = "0" ]; then gh label create "$label"; fi
            label_args+=(--label "$label")
          done
          gh issue create --title "$ROW_TITLE" --body "$ROW_BODY" "${label_args[@]}"

  # THE RELEASE: one call, and the only job here that can publish. Every job above is a guard it WAITS FOR, so a red one stops the call
  # and nothing is skipped to get a pass. The permissions are what the called workflow's jobs may use (a called workflow can keep or
  # reduce a permission and never gain one): `contents: write` for its tags, `checks: read` for its gate, `id-token: write` for the
  # OIDC publish in the `npm-publish` environment (ADR 0043), limited to `main`. NO STORED REGISTRY TOKEN AND NO `A11IGN_BOT_TOKEN`:
  # there is no pull request to open. The file name is the one npm's trusted-publisher entries name (workflow `release.yml`,
  # environment `npm-publish`): the OIDC token names the CALLING file, so renaming this file breaks the publish.
  release:
    if: github.event_name == 'push'
    needs: [action-smoke, capture-regression, consumer-gate, guards]
    permissions:
      contents: write
      checks: read
      id-token: write
    # No job-level `concurrency`: the workflow-level group above holds the whole run, and a job-level group of the same name would
    # wait on its own run. The called workflow carries its own, per repository.
    uses: a11ign/toolchain/.github/workflows/release-per-merge.yml@5ea3fc027eb0891d6329e6a02c2d4ed1c679178a
    with:
      kind: npm
      gate-check: gate
