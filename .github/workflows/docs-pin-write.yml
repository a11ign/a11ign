name: docs-pin-write

# A PROMOTION OF `v0` OPENS THE PULL REQUEST THAT RE-PINS THE DOCS TO IT (#5224, #5121 option A, `ceo` 2026-10-11). The docs pins were re-pinned
# by hand and the real-tree guard (`docs-release-pin-currency.real-tree.test.ts`) failed unrelated merges whenever `v0` moved: three red mains in
# two days (#4918, #5069, #5119). A release commit cannot carry the pin that names it and never reaches `main` (`release.yml` builds it detached
# and tags it), so the pin can only be written AFTER the tag exists, and `main` requires an approving review (#2022), so it is a pull request.
#
#   decide   reads `v0` and the `a11ign@<x.y.z>` tags in a full clone of `main`, plans the rewrite with `planRepin`
#            (`packages/guards/src/docs-release-pin-currency.ts`, the guard's own reader and population), and hands on the changed docs plus
#            three strings. It holds `contents: read` and NO `id-token`. A pin the rewrite cannot match is a RED job naming file and line.
#   regenerate  applies those docs to a checkout of the same commit and regenerates the two files generated from README's Quickstart fence
#            (#5291, `ceo` on #5283): `scripts/outsider/outsider-job.yml` by `node scripts/outsider/generate.ts --sha=<the pin's commit>
#            --version=<x.y.z>`, and `.github/workflows/consumer-gate.yml` by `generate()` of `scripts/generate-consumer-gate.ts`, with ITS
#            COMMITTED PIN KEPT. A re-pin alone left `outsider-job-fresh.test.ts` and `generate-consumer-gate.test.ts` red on every release (#4918,
#            #5119, #5283): a person regenerated them by hand each time. It holds `contents: read` and NO `id-token`, because it is the job that
#            installs and runs repository code. It hands on the files that differ, and only those, hidden directories included (#5468: the
#            artifact action dropped `.github/` and the consumer gate never arrived), and names them so `write` can refuse a short delivery.
#   write    mints the token, shape-checks what was handed against the commit it was read at, writes ONE commit of the changed docs, the
#            regenerated generated files and its own `.acceptance/` file onto ONE branch (`automation/docs-pin-write`, so a later release updates the open pull request and never
#            opens a second), and opens the pull request as a DRAFT if none is open. It has no checkout, no install and no node.
#
# ## Why a separate workflow, not two jobs in `release.yml` (`ceo`, #5224)
#
# `release.yml`'s header (item 3) says nothing in it opens a pull request and `promote-action-tag` alone holds a ref-write token. A docs edit
# does not widen the publish path. `decide-outsider-pin` and `refresh-outsider-pin` in `release.yml` are the SHAPE copied here (a read-only job
# decides, an `id-token: write` job with no checkout writes through Octo STS), not the file this lives in. This workflow reads NOTHING from the
# `release` run but its conclusion: it checks out `main` itself, so what a `workflow_run` hands a privileged job from an untrusted run is not here.
#
# ## What the pull request is, and is not
#
# A DRAFT, which `auto-arm.yml` never arms: an approving review marks it ready and arms it (#4969), so a person reads it first. The body says
# the prose beside each pin is MOSTLY UNREAD: a pin's own commit and the `a11ign@<x.y.z>` label on that same line move, and so do exactly the two
# sentences that restate the release in words (#5291, `restateRelease`). Nothing is merged here.
# The real-tree guard STAYS as it is: it is what notices a re-pin that was never merged. FLAG: none. REVERT: `git revert` this file, its policy
# and the guard change; a pull request already open is closed by hand.
#
# ## What the Octo STS installation holds (read 2026-10-12, row #5224 Change 3)
#
# `pull_requests` write on THIS repository: the installation's bot (`octo-sts[bot]`) authored #5210 on this repository on 2026-10-12 through
# `consumer-gate-pin-write.sts.yaml`, whose policy grants `pull_requests: write`, and `acceptance-sweep` and `auto-arm` hold the same grant. `contents`
# write is the one `promote-action-tag` uses for the tag writes. This policy asks for those two and nothing else, `workflows` included. A refusal of
# the write that says `Resource not accessible by integration` is an installation fault a person must read, and the step says so.
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions: {}

# One re-pin at a time. Never cancelled: a cancelled run could stop between the push and the pull request.
concurrency:
  group: docs-pin-write
  cancel-in-progress: false

jobs:
  decide:
    # A `release` run that did not succeed promoted nothing. A dispatch is a person's live reading and always runs.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      action: ${{ steps.plan.outputs.action }}
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      # A full clone: `v0` and the release tags are not reachable from `main`'s history alone, and `v0` moves.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # No `pnpm install`: the planner imports nothing, and Node strips the types of the one file it imports, so no dependency code runs here.
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - name: Plan the re-pin at the commit `v0` names, and stage the docs that change
        id: plan
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/repin-plan.ts"
          cat > "$script" <<'PLAN'
          import { execFileSync } from "node:child_process";
          import { appendFileSync, mkdirSync, readFileSync, writeFileSync } from "node:fs";
          import { dirname, join } from "node:path";
          import { pathToFileURL } from "node:url";

          const guard = join(process.env.GITHUB_WORKSPACE, "packages/guards/src/docs-release-pin-currency.ts");
          const { planRepin, repoReader } = await import(pathToFileURL(guard).href);
          const git = (args) => execFileSync("git", args, { encoding: "utf8" });
          const emit = (pairs) => appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(pairs).map(([key, value]) => `${key}=${value}\n`).join(""));

          const plan = planRepin(repoReader(git, (path) => readFileSync(path, "utf8")));
          if (plan.status === "refused") {
            for (const fault of plan.faults) console.log(`::error::${fault}`);
            console.log("::error::No re-pin was written.");
            process.exit(1);
          }
          if (plan.status === "current") {
            console.log(`every guarded doc already pins a11ign@${plan.promoted.version} (${plan.promoted.commit}) or newer; nothing to move`);
            emit({ action: "keep", version: plan.promoted.version, commit: plan.promoted.commit });
            process.exit(0);
          }
          for (const file of plan.files) {
            const out = join(process.env.RUNNER_TEMP, "repinned", file.path);
            mkdirSync(dirname(out), { recursive: true });
            writeFileSync(out, file.text);
            console.log(`re-pinned ${file.path} to a11ign@${plan.promoted.version}`);
          }
          emit({ action: "write", version: plan.promoted.version, commit: plan.promoted.commit, base: git(["rev-parse", "HEAD"]).trim() });
          PLAN
          node "$script"
      - name: Hand on the changed docs
        if: steps.plan.outputs.action == 'write'
        uses: actions/upload-artifact@v7
        with:
          name: docs-repinned
          path: ${{ runner.temp }}/repinned
          if-no-files-found: error
          retention-days: 1

  # Runs repository code (`pnpm install`, the generators), so it holds NO `id-token`: it cannot ask for the token `write` mints. The shape of
  # `consumer-gate-pin.yml`'s `regenerate`. `consumer-gate.yml`'s pin is KEPT, not re-baked at HEAD: its prose copies README's fence (so a
  # re-pin stales it, measured at row #5291) but its pin answers a different question, whether it contains `action.yml` at the commit, which a
  # docs re-pin does not change and `consumer-gate-pin.yml` repairs when `action.yml` does. Keeping it also leaves `generate-consumer-gate.ts`'s
  # own refusal of a dirty README (#1721) with nothing to guard: that refusal is about a pin baked from `git rev-parse HEAD`, and none is.
  regenerate:
    needs: [decide]
    if: ${{ !cancelled() && needs.decide.result == 'success' && needs.decide.outputs.action == 'write' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      regenerated: ${{ steps.stage.outputs.regenerated }}
      files: ${{ steps.stage.outputs.files }}
    steps:
      # The commit `decide` planned on, not whatever `main` is by now: the docs handed on are that commit's docs with their pins moved.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.decide.outputs.base }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # `generate.ts` imports `generate-consumer-gate.ts`, which imports `repo-identity.ts` and does `await toolModule(...)` at import: on a
      # runner no tool exists until this has cloned one (#3534, #4373).
      - name: The tool at the newest release tag, cloned for this run, with `agent-org` on PATH (#3534)
        run: node scripts/agent-org-newest-tag.ts --dest="$RUNNER_TEMP/agent-org"
      - name: Take the changed docs
        uses: actions/download-artifact@v8
        with:
          name: docs-repinned
          path: ${{ github.workspace }}
      - name: Regenerate the outsider job and the consumer gate from the re-pinned README, and hand on the files that differ
        id: stage
        env:
          VERSION: ${{ needs.decide.outputs.version }}
          COMMIT: ${{ needs.decide.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$VERSION' is not an x.y.z"; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::'$COMMIT' is not a full commit sha"; exit 1; }
          script="$RUNNER_TEMP/regenerate-consumer-gate.ts"
          cat > "$script" <<'GATE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { pathToFileURL } from "node:url";

          const gate = await import(pathToFileURL(join(process.env.GITHUB_WORKSPACE, "scripts/generate-consumer-gate.ts")).href);
          const committed = readFileSync(gate.OUT, "utf8");
          writeFileSync(gate.OUT, gate.generate(readFileSync(gate.README_PATH, "utf8"), gate.extractPinnedSha(committed)));
          GATE
          # The docs were staged, so what is unstaged or untracked after the generators is what they wrote and nothing else.
          git add -A
          # WITHOUT `--sha` the outsider generator pins the checkout's HEAD, which is `main` and not the release: the wrong file, and green (#5283).
          node scripts/outsider/generate.ts --sha="$COMMIT" --version="$VERSION"
          node scripts/outsider/generate.ts --check
          node "$script"
          node scripts/generate-consumer-gate.ts --check
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; })"
          if [ -z "$changed" ]; then
            echo "both generated files already match README's re-pinned fence at a11ign@${VERSION}; nothing to hand on"
            echo "regenerated=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r path; do
            [[ "$path" == ".github/workflows/consumer-gate.yml" || "$path" == "scripts/outsider/outsider-job.yml" ]] || {
              echo "::error::regeneration must change the consumer gate and the outsider job and nothing else; it changed '$path'"; exit 1; }
            mkdir -p "$RUNNER_TEMP/regenerated/$(dirname "$path")"
            cp "$path" "$RUNNER_TEMP/regenerated/$path"
          done <<<"$changed"
          # Declared AFTER the loop refused every path but the two, so `write` can check each one ARRIVED (#5468).
          echo "files=$(LC_ALL=C sort <<<"$changed" | paste -sd' ')" >> "$GITHUB_OUTPUT"
          echo "regenerated=some" >> "$GITHUB_OUTPUT"
      - name: Hand on the regenerated files
        if: steps.stage.outputs.regenerated == 'some'
        uses: actions/upload-artifact@v7
        with:
          name: files-regenerated
          path: ${{ runner.temp }}/regenerated
          # `.github/workflows/consumer-gate.yml` sits under a hidden directory, and the action leaves hidden files out by default: run
          # 38453561679 uploaded ONE file (`outsider-job.yml`), the pull request carried no consumer gate and went red (#5468).
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  write:
    needs: [decide, regenerate]
    if: ${{ !cancelled() && needs.decide.result == 'success' && needs.decide.outputs.action == 'write' && needs.regenerate.result == 'success' }}
    runs-on: ubuntu-latest
    # NO checkout, install, node or pnpm in this job (the header says why): `gh`, `jq`, `base64`, `sed`, `diff` only. The writes come from the
    # minted token, whose grant is `docs-pin-write.sts.yaml`'s; the job's own `GITHUB_TOKEN` is reduced to the artifact read plus the OIDC request.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mint a token that may push a branch and open a pull request, for this workflow as it is on main (no fallback to GITHUB_TOKEN)
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: docs-pin-write
      - name: Take the changed docs
        uses: actions/download-artifact@v8
        with:
          name: docs-repinned
          path: ${{ runner.temp }}/repinned
      # Into the same tree: the loop below shape-checks them like docs, so a regenerated file that differs by more than shas and versions is refused.
      - name: Take the regenerated files
        if: needs.regenerate.outputs.regenerated == 'some'
        uses: actions/download-artifact@v8
        with:
          name: files-regenerated
          path: ${{ runner.temp }}/repinned
      - name: Move the re-pin branch onto main, write the docs onto it, and open the pull request unless one is open
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: automation/docs-pin-write
          VERSION: ${{ needs.decide.outputs.version }}
          COMMIT: ${{ needs.decide.outputs.commit }}
          BASE: ${{ needs.decide.outputs.base }}
          HANDED: ${{ runner.temp }}/repinned
          REGENERATED: ${{ needs.regenerate.outputs.files }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1. Nothing was written."; exit 1; }
          [ -n "${GH_TOKEN:-}" ] || fail "the Octo STS token (step octo-sts) is empty"
          # What the previous job handed over is data: it is written only if it is the guarded docs at BASE, and the two generated files regenerated, with their pins moved and nothing else.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "'$VERSION' is not an x.y.z"
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || fail "'$COMMIT' is not a full commit sha"
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || fail "'$BASE' is not a full commit sha"
          guarded='^(README\.md|docs/[^/]+\.md|docs/adr/[^/]+\.md|scripts/outsider/outsider-job\.yml|\.github/workflows/consumer-gate\.yml)$'
          mapfile -t paths < <(cd "$HANDED" && find . -type f | sed 's|^\./||' | LC_ALL=C sort)
          [ "${#paths[@]}" -gt 0 ] || fail "the artifact holds no file"
          # A file `regenerate` changed that never arrived is a re-pin that is red by construction (#5468): refuse rather than hand on the rest.
          for declared in $REGENERATED; do
            [ -f "$HANDED/$declared" ] || fail "$declared was regenerated but did not reach this job"
          done
          scratch="$(mktemp -d)"
          # A line is a pin line when it differs from BASE; it may differ ONLY in the 40-hex shas and the x.y.z versions, and must now name the
          # promoted commit (an action pin) or version (an install pin). A changed byte anywhere else, an added line or a removed one is refused.
          mask() { sed -E 's/[0-9a-f]{40}/SHA/g; s/[0-9]+\.[0-9]+\.[0-9]+/VER/g'; }
          # The entries live in a FILE, never in an argument: a doc's text passed through `--argjson` is past the kernel's limit on one argument.
          entries="$scratch/entries.json"
          echo '[]' > "$entries"
          add_entry() { jq -c --arg p "$1" --rawfile c "$2" '. + [{path: $p, mode: "100644", type: "blob", content: $c}]' "$entries" > "$entries.next" && mv "$entries.next" "$entries"; }
          for path in "${paths[@]}"; do
            [[ "$path" =~ $guarded ]] || fail "'$path' is not a guarded doc or a generated file (README.md, docs/*.md, docs/adr/*.md, scripts/outsider/outsider-job.yml, .github/workflows/consumer-gate.yml)"
            gh api "repos/$REPO/contents/$path?ref=$BASE" --jq .content | base64 -d > "$scratch/base" || fail "$path at $BASE could not be read"
            handed="$HANDED/$path"
            [ "$(wc -l < "$scratch/base")" = "$(wc -l < "$handed")" ] || fail "$path changed its number of lines"
            removed="$(diff --old-line-format='%L' --new-line-format='' --unchanged-line-format='' "$scratch/base" "$handed" || true)"
            added="$(diff --old-line-format='' --new-line-format='%L' --unchanged-line-format='' "$scratch/base" "$handed" || true)"
            [ -n "$added" ] || fail "$path is handed on but differs from $BASE in no line"
            [ "$(mask <<<"$removed")" = "$(mask <<<"$added")" ] || fail "$path differs from $BASE in more than the shas and versions of its pin lines"
            # An action pin must name the promoted commit itself; every other changed line must name the promoted version, as a label
          # (`a11ign@x.y.z`) or in the one sentence that restates a pin's release (`commit of release x.y.z`, #5291).
            while IFS= read -r line; do
              if [[ "$line" =~ uses:[[:space:]]*a11ign/a11ign@([0-9a-f]{40}) ]]; then
                [ "${BASH_REMATCH[1]}" = "$COMMIT" ] || fail "a changed line of $path pins ${BASH_REMATCH[1]}, not the promoted commit $COMMIT"
              else
                [[ "$line" == *"a11ign@$VERSION"* || "$line" == *"commit of release $VERSION"* ]] || fail "a changed line of $path is neither an action pin nor names a11ign@$VERSION: $line"
              fi
            done <<<"$added"
            add_entry "$path" "$handed"
          done
          # THE PULL REQUEST CARRIES ITS OWN ACCEPTANCE FILE (#5212, ADR 0044): the reader takes the commands from the file a pull request ADDS
          # under `.acceptance/` and reads the body only for an exempt author, which the Octo STS app is not. The name carries the commit because
          # only a file ADDED against `main` counts, and a file a previous re-pin merged stays until `acceptance-sweep.yml` removes it.
          acceptance_path=".acceptance/automation~docs-pin-write-${COMMIT:0:12}.md"
          acceptance_file="$scratch/acceptance.md"
          cat > "$acceptance_file" <<EOF
          Moves the guarded docs' release pins to a11ign@${VERSION} (commit ${COMMIT}), the release \`v0\` points at. Written by \`docs-pin-write.yml\` (#5224); the file is generated, never edited by hand.

          History: full

          The \`History: full\` line is there because \`generate-consumer-gate.test.ts\`'s #4153 real-tree case runs \`git diff <pin> origin/main -- action.yml\`, and the pin is a commit of \`main\` that the \`acceptance\` job's depth-1 clone does not hold (\`fatal: bad object <pin>\`, #5651). \`git fetch --unshallow origin main\` does.

          Acceptance:
          pnpm exec rstest run --config scripts/rstest/rstest.config.ts packages/guards/src/docs-release-pin-currency.test.ts packages/guards/src/outsider-job-fresh.test.ts packages/guards/src/generate-consumer-gate.test.ts
          EOF
          add_entry "$acceptance_path" "$acceptance_file"
          # ONE commit on BASE's own tree with exactly those entries, its only parent BASE, and the branch moved straight onto it: a branch holding
          # the docs without their acceptance file (or the reverse) is a state this job must never leave behind. The branch belongs to this
          # workflow alone, so a newer re-pin replaces an older one. Called under `if !`, where `set -e` does not apply: every step answers itself.
          write_branch() {
            local base_tree tree commit
            base_tree="$(gh api "repos/$REPO/git/commits/$BASE" --jq .tree.sha)" || return 1
            tree="$(jq -n --arg base "$base_tree" --slurpfile entries "$entries" '{base_tree: $base, tree: $entries[0]}' \
              | gh api -X POST "repos/$REPO/git/trees" --input - --jq .sha)" || return 1
            commit="$(jq -n --arg tree "$tree" --arg parent "$BASE" --arg message "docs: re-pin the release pins to a11ign@${VERSION} (docs-pin-write.yml, #5224)" \
              '{message: $message, tree: $tree, parents: [$parent]}' | gh api -X POST "repos/$REPO/git/commits" --input - --jq .sha)" || return 1
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "the commit API answered '$commit', not a sha"; return 1; }
            if gh api "repos/$REPO/git/ref/heads/$BRANCH" > /dev/null 2>&1; then
              gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH" -f sha="$commit" -F force=true > /dev/null || return 1
            else
              gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$commit" > /dev/null || return 1
            fi
          }
          if ! response="$(write_branch 2>&1)"; then
            printf '%s\n' "$response"
            echo "::error::the write of ${BRANCH} was refused; if the response says 'Resource not accessible by integration', the Octo STS App installation lacks 'contents' or 'pull_requests' write on ${REPO} (the policy asks for both): a person must accept it in the installation's settings."
            exit 1
          fi
          # The shape check, on the branch itself: it differs from BASE by the handed docs and the acceptance file, and by nothing else.
          changed="$(gh api "repos/${REPO}/compare/${BASE}...${BRANCH}" --jq '[.files[].filename] | sort | join(" ")')"
          expected="$(printf '%s\n' "${paths[@]}" "$acceptance_path" | LC_ALL=C sort | paste -sd' ')"
          [ "$changed" = "$expected" ] || { echo "::error::${BRANCH} differs from ${BASE} by '${changed}', not by '${expected}'. No pull request was opened."; exit 1; }
          title="docs: re-pin the release pins to a11ign@${VERSION}"
          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          Moves the guarded docs' release pins to a11ign@${VERSION} (commit ${COMMIT}), which \`v0\` points at. Opened by \`docs-pin-write.yml\` (#5224, #5121 option A) after a \`release\` run succeeded.

          **The prose beside each pin is MOSTLY UNREAD.** A pin's own commit and the \`a11ign@x.y.z\` label on that same line were rewritten, and so were exactly two sentences that restate the release in words (\`commit of release x.y.z, so your CI ...\` and \`a11ign@x.y.z is the tag the pin above names\`, #5291). A sentence that says "since 0.9.0", "\`latest\` read 0.9.0 on <date>" or describes what that release does was not checked: read the neighbours of each pin, and \`git grep\` the previous version in the docs this changes, before approving.

          \`scripts/outsider/outsider-job.yml\` and \`.github/workflows/consumer-gate.yml\`, when listed below, were regenerated from the re-pinned README (#5291): the first by \`node scripts/outsider/generate.ts --sha=${COMMIT} --version=${VERSION}\`, the second with its committed pin kept, so \`outsider-job-fresh.test.ts\` and \`generate-consumer-gate.test.ts\` are green without a hand commit.

          This is a draft and does not arm itself: an approving review marks it ready and arms it (#4969).

          Files: ${paths[*]}

          Acceptance file: ${acceptance_path}

          Closes: none — automated re-pin of the docs' release pins to a11ign@${VERSION} (#5224)
          EOF
          open="$(gh api "repos/${REPO}/pulls?state=open&head=${REPO%%/*}:${BRANCH}" --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh api -X PATCH "repos/${REPO}/pulls/${open}" -f title="$title" -F body=@"$body_file" > /dev/null
            echo "::notice::updated the open re-pin pull request #${open} to a11ign@${VERSION}"
            exit 0
          fi
          gh api --method POST "repos/${REPO}/pulls" -f title="$title" -f head="$BRANCH" -f base=main -F draft=true -F body=@"$body_file" \
            --jq '"::notice::opened re-pin pull request #\(.number) (draft)"'
