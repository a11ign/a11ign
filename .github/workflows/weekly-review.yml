name: Weekly outsider review

# THE JUDGEMENT HALF OF THE V1 REHEARSAL: ONE ROW A WEEK, NEVER A GATE (chairman's direction, #928; row #3183).
# A wall-clock event is the one thing a schedule is right for -- this does not look for work, it files the
# week's review for a session that built none of the recent work to take.
# `scripts/weekly-review.mjs` says what the row holds and why; `docs/weekly-review.md` is how a reviewer works.
#
# THE SCHEDULE IS A SYSTEMD TIMER ON THE HOST, NOT THIS FILE (ceo, #3183, 2026-10-03; row #3318). The board step
# cannot run under `github.token` (organization Project 1 does not resolve for it, run 37133463643) and must not
# run under a widened one, so this file's schedule filed `Weekly outsider review 2026-W40` with no board item, no Status
# and no `ready`, and ended red. `workflow_dispatch` is the by-hand BACKSTOP and the only trigger: no `schedule`,
# no `pull_request`, so nothing in this file can be tripped by a change, and a dispatch is idempotent (a second
# run in the same ISO week files nothing and says so).
on:
  workflow_dispatch:

permissions:
  contents: read          # the checkout, which is where RELEASE.md and docs/try-it.md are READ from
  issues: write           # the row, and the re-check comment on last week's. Nothing broader.

concurrency:
  # Two runs of the same week would race the idempotency check; the second waits and then files nothing.
  group: weekly-review
  cancel-in-progress: false

jobs:
  file:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: The tool at the newest release tag, cloned for this run, with `agent-org` on PATH (#3534)
        run: node scripts/agent-org-newest-tag.mjs --dest="$RUNNER_TEMP/agent-org"
      - name: File this week's review row
        env:
          GH_TOKEN: ${{ github.token }}
          # `row-file` refuses a plain clone, which is what a runner's checkout is (first dispatch, #3183). Its refusal
          # protects a tree OTHER SESSIONS SHARE (#1352); a runner's is deleted when the job ends. The printed override
          # is the one the refusal's own docs name for "CI's plain clone", not a way round the filing contract.
          A11Y_POLICY_LAUNCH_REASON: ephemeral Actions runner, shares no tree with any session
        run: node scripts/weekly-review.mjs
