# Dependency updates come from the platform (chairman, 2026-10-03, #928 ADR 0041 decision 4; row #3133): a new
# release of a dependency opens a pull request here, so nobody polls for one. Dependabot, because it is a file
# and not an app install. `agent-org` is no dependency of this repository (#3534), so there is nothing here for it.
# `dependency-updates-configured.test.ts` pins every choice below.
version: 2
updates:
  - package-ecosystem: npm
    # ONE entry at the root covers the pnpm workspace: Dependabot reads `pnpm-workspace.yaml` and updates
    # every `packages/*/package.json` and `pnpm-lock.yaml` from here. A second entry per package would open
    # the same bump twice.
    directory: /
    schedule:
      # A release a day needs a check at least that often.
      interval: daily
    # NO `groups:` ON PURPOSE. Without one, every dependency is its own pull request, which is what makes a
    # bump small, frequent and mergeable alone. A group that batches unrelated packages is refused by the test.
    commit-message:
      # The handle the org's gate recognises a dependency pull request by: every title starts `deps:`.
      # (Dependabot also labels `dependencies`, creating it on the first pull request, and the author is
      # `dependabot[bot]`; the prefix is the one of the three this repo controls and can pin.)
      prefix: deps
    # Workspace members are pinned "0.0.0" and linked by pnpm (`linkWorkspacePackages`); `changeset version`
    # owns their ranges. Left alone, Dependabot would offer the registry's 0.1.0 over that pin. The test
    # derives this list from the manifests, so a package that joins or leaves the workspace moves it
    # deliberately: remove an entry when its package leaves and is consumed by range instead.
    ignore:
      - dependency-name: "@a11ign/control"
      - dependency-name: "@a11ign/evidence"
      - dependency-name: "@a11ign/judge"
      - dependency-name: "@a11ign/scorer"
      - dependency-name: "@a11ign/toolchain"
      - dependency-name: "a11ign"
  - package-ecosystem: github-actions
    # #3775: `release.yml` calls `a11ign/toolchain`'s reusable `release-per-merge.yml` at a full commit sha, and nothing
    # else moves that sha, so a fix to the shared workflow would never reach this repository. This ecosystem reads every
    # `uses:` in `.github/workflows/`, so the same entry also keeps the `actions/*` pins current. `directory: /` is the
    # one Dependabot documents for it: it reads `.github/workflows/` from there.
    # WHAT IT REWRITES THE CALL TO: a sha, never a tag. `release-safety.test.ts` requires the call to stay pinned by sha, and
    # dependabot-core's `update_checker.rb#updated_ref` returns the new COMMIT sha whenever the current ref looks like one
    # (`pinned_ref_looks_like_commit_sha?`); only the ref after `@` is replaced. An untagged sha moves to the head of the
    # default branch, but only once the repository holds at least one version-like tag (`@a11ign/toolchain@0.1.2` ends in
    # `0.1.2`, which `VERSION_REGEX` reads); a sha that IS a tag's commit moves to the newest version tag's commit.
    directory: /
    schedule:
      interval: daily
    # No `groups:`, for the reason the `npm` entry gives.
    commit-message:
      prefix: deps
    # #3804: `consumer-gate.yml` is GENERATED (`node scripts/run.mjs consumer-gate`) and calls `a11ign/a11ign` at a sha it
    # holds at four sites, which its own `check-pin` job and `consumer-gate.test.ts` compare. Dependabot rewrites ONE of the
    # four, so the pull request cannot merge correct, and it would open another for each new head of `main` (#3797).
    # The generator owns that pin, so Dependabot is told not to touch it. `a11ign/toolchain` and the `actions/*` pins are
    # NOT ignored and keep moving; the test refuses any other name on this list.
    ignore:
      - dependency-name: "a11ign/a11ign"
